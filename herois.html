<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Heróis de Papel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26142f;--gold:#ffc83d;--pink:#ff4fa3;--paper:#fff7e6;--bg:#120a24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:18px 14px;overflow-y:auto;background:linear-gradient(180deg,rgba(18,10,36,.35),rgba(18,10,36,.82) 55%)}
.title{font-family:Bangers,Impact,sans-serif;font-size:52px;letter-spacing:2px;color:var(--gold);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:6px 0 0;line-height:1;text-align:center;transform:rotate(-3deg)}
.sub{color:#fff;font-weight:800;font-size:14px;margin:8px 0 10px;text-align:center;text-shadow:0 2px 0 var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.card{width:100%;max-width:372px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px;margin:7px 0}
.stg{display:flex;align-items:center;gap:10px;padding:9px 10px;border:3px solid var(--ink);border-radius:12px;margin:5px 0;background:#fff;font-weight:800;font-size:15px;cursor:pointer}
.stg small{display:block;font-weight:600;font-size:12px;opacity:.7}
.stg .n{font-family:Bangers,Impact;font-size:24px;width:30px;text-align:center}
.stg.on{background:var(--gold)}.stg.lock{opacity:.45}
.stg .r{margin-left:auto;font-size:18px}
button{font-family:Bangers,Impact,sans-serif;font-size:24px;letter-spacing:1px;border:3px solid var(--ink);border-radius:14px;padding:9px 18px;margin:5px;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:var(--ink);background:#fff}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);font-size:30px;width:100%;max-width:372px}
.row{display:flex;gap:6px;width:100%;max-width:372px}.row button{flex:1;font-size:21px;padding:8px 6px}
.hero{display:flex;gap:10px;align-items:center}
.hero canvas{position:static;width:70px;height:70px;flex:0 0 70px;background:#ffe9b8;border:3px solid var(--ink);border-radius:12px}
.hero .i{flex:1;min-width:0}
.hero b{font-size:17px}.hero .rl{font-size:12px;opacity:.75;font-weight:700}
.hero .sp{font-size:12px;margin-top:2px}
.hero .bt{display:flex;gap:5px;margin-top:5px}
.hero .bt button{font-size:16px;padding:5px 9px;margin:0;box-shadow:0 3px 0 var(--ink)}
.hero .bt .in{background:#7be07b}.hero .bt .up{background:var(--gold)}
.hero.lock canvas{filter:grayscale(1) brightness(.6)}
.cards{display:flex;flex-direction:column;gap:9px;width:100%;max-width:372px;margin-top:6px}
.dc{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;box-shadow:0 5px 0 var(--ink);cursor:pointer;animation:pop .35s ease-out backwards;text-align:left}
.dc:nth-child(2){animation-delay:.08s}.dc:nth-child(3){animation-delay:.16s}
.dc .ic{font-size:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:12px;background:#ffe9b8;flex:0 0 52px}
.dc .ic canvas{position:static;width:46px;height:46px}
.dc b{font-size:17px;display:block}.dc span{font-size:13px;font-weight:600}
.dc.lux{background:linear-gradient(135deg,#fff3b0,#ffc83d)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.ban{font-family:Bangers,Impact;font-size:44px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);margin-top:20px;text-align:center}
.note{font-size:12px;color:#fff;opacity:.8;text-align:center;margin-top:8px;font-weight:600}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="sHome" class="scr">
    <div class="title">Heróis<br>de Papel</div>
    <div class="sub">Os heróis dos livros contra traças, censores e queimadores</div>
    <div class="pill">📜 <span id="hPg">0</span> páginas</div>
    <div class="card" id="hStages"></div>
    <button class="big" id="bPlay">⚔️ Batalha!</button>
    <button class="big" id="bAdv" style="background:#3fa9f5">🗺️ Aventura</button>
    <div class="row"><button id="bHeroes">🦸 Heróis</button><button id="bBack">↩ Jogos</button></div>
    <div class="note" id="hNote"></div>
  </div>

  <div id="sHeroes" class="scr hidden">
    <div class="title" style="font-size:40px">Estante dos Heróis</div>
    <div class="sub">Equipa: <span id="tCount">0</span>/3 · 📜 <span id="tPg">0</span> páginas</div>
    <div id="hList" style="width:100%;max-width:372px"></div>
    <button class="big" id="bHeroesOk">✔ Feito</button>
  </div>

  <div id="sDraft" class="scr hidden" style="justify-content:center">
    <div class="ban" id="dTitle">Onda limpa!</div>
    <div class="sub">Escolhe uma carta</div>
    <div class="cards" id="dCards"></div>
  </div>

  <div id="sEnd" class="scr hidden" style="justify-content:center">
    <div class="ban" id="eTitle">Vitória!</div>
    <div class="card" style="text-align:center;font-weight:800;font-size:16px" id="eInfo"></div>
    <button class="big" id="eAgain">⚔️ Outra vez</button>
    <button class="big" id="eNext" style="background:var(--gold);color:var(--ink)">➡ Próxima biblioteca</button>
    <div class="row"><button id="eHeroes">🦸 Heróis</button><button id="eHome">🏠 Início</button></div>
  </div>
</div>

<script>
'use strict';
/* ====== HERÓIS DE PAPEL — auto-battler lateral para os livrólicos ====== */
const cv = document.getElementById('c'), wrap = document.getElementById('wrap');
let g = cv.getContext('2d');
const $ = id => document.getElementById(id);
const IN_FRAME = window.parent !== window;
let W = 400, H = 760, DPR = 1, cardTop = 640, groundY = 590;
function resize() {
  const vw = innerWidth, vh = innerHeight;
  H = Math.round(Math.min(900, Math.max(660, 400 * vh / vw)));
  const k = Math.min(vw / W, vh / H);
  wrap.style.width = W * k + 'px'; wrap.style.height = H * k + 'px';
  DPR = Math.min(2.5, (window.devicePixelRatio || 1) * k);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cardTop = H - 150; groundY = Math.round(50 + .915 * (cardTop - 50)); // linha do passeio nos fundos
  // os ecrãs HTML ficam à escala do canvas
  document.querySelectorAll('.scr').forEach(s => { s.style.width = W + 'px'; s.style.height = H + 'px'; s.style.transform = 'scale(' + k + ')'; s.style.transformOrigin = '0 0'; s.style.inset = 'auto'; s.style.left = '0'; s.style.top = '0'; });
}
addEventListener('resize', resize); resize();

/* ---------- dados ---------- */
const HD = {
  quixote:  { n: 'Dom Quixote',     role: 'Tanque · lança',          hp: 270, atk: 15, cd: .9,  rng: 50,  cost: 0,    col: '#c9cdd6', sp: 'Carga contra moinhos', spd: 'Investe, empurra e fere tudo à frente. Ganha escudo.', say: ['Ao ataque, Rocinante!', 'Gigantes! Eu bem dizia!', 'Moinho ou traça, tanto faz!'] },
  holmes:   { n: 'Sherlock Holmes', role: 'Atirador · críticos',     hp: 145, atk: 20, cd: 1.05, rng: 235, cost: 0,   col: '#a5844f', crit: .3, sp: 'Elementar!', spd: 'Marca todos (+50% dano) e dá um tiro certeiro no mais forte.', say: ['Elementar, minha traça!', 'O culpado és tu!', 'Caso encerrado.'] },
  dracula:  { n: 'Drácula',         role: 'Lutador · rouba vida',    hp: 205, atk: 17, cd: .8,  rng: 52,  cost: 300,  col: '#b3203a', ls: .3, sp: 'Sede de sangue', spd: 'Morcegos atacam vários inimigos e curam a equipa.', say: ['Tenho sede… de traças!', 'Filhos da noite, ao ataque!', 'Bleh! Sabes a papel.'] },
  alice:    { n: 'Alice',           role: 'Apoio · abranda',         hp: 135, atk: 11, cd: .85, rng: 205, cost: 500,  col: '#f2c84b', slow: 1, sp: 'Bebe-me!', spd: 'Encolhe todos os inimigos: batem metade e levam mais.', say: ['Cada vez mais curioso!', 'Bebe-me! Ups, não era para mim.', 'Cortem-lhes a cabeça!'] },
  nemo:     { n: 'Capitão Nemo',    role: 'Atirador · perfura',      hp: 155, atk: 19, cd: 1.2, rng: 265, cost: 800,  col: '#22385e', sp: 'Torpedo do Nautilus', spd: 'Torpedo que atravessa a fila inteira.', say: ['Torpedo largado, raios!', 'Mobilis in mobili!', 'Vinte mil léguas de porrada!'] },
  adamastor:{ n: 'Adamastor',       role: 'Gigante · dano em área',  hp: 330, atk: 26, cd: 1.6, rng: 64,  cost: 1200, col: '#6f8fa6', splash: 75, sp: 'Tormenta', spd: 'Tempestade em todos os inimigos e abranda-os.', say: ['Treme, que eu sou o Adamastor!', 'Ninguém passa o Cabo!', 'Tormenta neles!'] },
};
const ORDER = ['quixote', 'holmes', 'dracula', 'alice', 'nemo', 'adamastor'];
const ED = {
  traca:     { n: 'Traça',           hp: 28,  atk: 5,  spd: 60, rng: 40,  cd: 1,   fly: 1, pg: 2 },
  rato:      { n: 'Rato de arquivo', hp: 44,  atk: 7,  spd: 74, rng: 38,  cd: .9,  pg: 2 },
  bolor:     { n: 'Bolor',           hp: 95,  atk: 9,  spd: 30, rng: 40,  cd: 1.3, pg: 3 },
  censor:    { n: 'Censor',          hp: 130, atk: 16, spd: 36, rng: 46,  cd: 1.5, pg: 4 },
  queimador: { n: 'Queimador',       hp: 72,  atk: 12, spd: 44, rng: 175, cd: 1.8, ranged: 1, pg: 4 },
  sombra:    { n: 'Esquecido',       hp: 110, atk: 14, spd: 52, rng: 42,  cd: 1.1, pg: 4 },
};
const ST = [
  { n: 'Livraria Lello',          c: 'Porto',          pool: ['traca', 'rato'],                        boss: 'traca',     bn: 'Traça-Rainha',        sky: ['#8fd8ea', '#d9f4ef'], hill: '#6aa58a', land: 'lello' },
  { n: 'Biblioteca Joanina',      c: 'Coimbra',        pool: ['traca', 'rato', 'bolor'],               boss: 'bolor',     bn: 'Bolor Ancestral',     sky: ['#9fcbe8', '#f3ecd2'], hill: '#7aa86a', land: 'joanina' },
  { n: 'Palácio de Mafra',        c: 'Mafra',          pool: ['rato', 'bolor', 'censor'],              boss: 'rato',      bn: 'Rato-Mor do Arquivo', sky: ['#a8c8f0', '#fbe6cf'], hill: '#87a96b', land: 'mafra' },
  { n: 'Real Gabinete de Leitura',c: 'Rio de Janeiro', pool: ['bolor', 'censor', 'queimador'],         boss: 'censor',    bn: 'O Grande Censor',     sky: ['#f6b27a', '#ffe0a8'], hill: '#5d9a62', land: 'gabinete' },
  { n: 'Torre do Tombo',          c: 'Lisboa',         pool: ['censor', 'queimador', 'sombra'],        boss: 'queimador', bn: 'Queimador-Mor',       sky: ['#7a6fb8', '#f2a37a'], hill: '#4f6f6a', land: 'tombo' },
  { n: 'Biblioteca de Alexandria',c: 'Alexandria',     pool: ['queimador', 'sombra', 'censor', 'traca'],boss: 'sombra',   bn: 'O Esquecimento',      sky: ['#3b2a6b', '#e8846a'], hill: '#b48a55', land: 'alex' },
];
const WAVES = 10, STAR_MUL = [0, 1, 1.6, 2.5];
const upCost = l => Math.round(60 * Math.pow(1.42, l - 1));
const lvlMul = l => 1 + .12 * (l - 1);

/* ---------- gravação (localStorage + nuvem do Telegram do jogo pai) ---------- */
const TG = (() => { try { return (window.parent.Telegram && window.parent.Telegram.WebApp) || (window.Telegram && window.Telegram.WebApp) || null; } catch (e) { return null; } })();
const cloudOK = () => { try { return !!(TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')); } catch (e) { return false; } };
const SV = { v: 0, p: 0, u: { quixote: 1, holmes: 1 }, team: ['quixote', 'holmes'], st: 0, sel: 0, best: {} };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function svParse(s) { try { const o = JSON.parse(s); return o && typeof o === 'object' ? o : null; } catch (e) { return null; } }
function svApply(o) { Object.assign(SV, o); SV.u = Object.assign({ quixote: 1, holmes: 1 }, o.u || {}); SV.team = (o.team || ['quixote']).filter(id => HD[id] && SV.u[id]); if (!SV.team.length) SV.team = ['quixote']; }
function save() {
  SV.v = Date.now(); const s = JSON.stringify(SV); lsSet('herois_s', s);
  if (cloudOK()) { try { TG.CloudStorage.setItem('herois_s', s); } catch (e) {} }
}
(function load() {
  const l = svParse(lsGet('herois_s')); if (l) svApply(l);
  if (cloudOK()) { try { TG.CloudStorage.getItem('herois_s', (err, v) => { const c = svParse(v); if (c && c.v > SV.v) { svApply(c); lsSet('herois_s', JSON.stringify(SV)); renderHome(); } }); } catch (e) {} }
})();

/* ---------- som ---------- */
let AC = null, muted = lsGet('herois_mute') === '1';
function beep(f, d, type, v, slide) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), gn = AC.createGain(), t0 = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + d);
    gn.gain.setValueAtTime(v || .05, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch (e) {}
}
const SFX = {
  hit: () => beep(180 + Math.random() * 80, .07, 'square', .025, 90),
  shot: () => beep(700, .08, 'triangle', .03, 300),
  kill: () => beep(520, .12, 'square', .035, 1100),
  sp: () => { beep(300, .25, 'sawtooth', .05, 900); setTimeout(() => beep(900, .2, 'square', .04, 1400), 90); },
  boom: () => beep(120, .4, 'sawtooth', .07, 40),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .18, 'square', .05), i * 120)),
  lose: () => [392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle', .06), i * 180)),
  card: () => beep(660, .1, 'triangle', .05, 990),
};
const MUSIC = new Audio('herois.mp3'); MUSIC.loop = true; MUSIC.volume = .35; let musicOK = true;
MUSIC.addEventListener('error', () => { musicOK = false; });
function musSync() { if (!musicOK) return; if (!muted && !document.hidden) { const p = MUSIC.play(); if (p && p.catch) p.catch(() => {}); } else MUSIC.pause(); }
addEventListener('pointerdown', () => setTimeout(musSync, 0)); document.addEventListener('visibilitychange', musSync);

/* ---------- desenho base ---------- */
const OUT = '#26142f';
function E(x, y, rx, ry, f, lw) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, 7); if (f) { g.fillStyle = f; g.fill(); } if (lw !== 0) { g.lineWidth = lw || 2.4; g.strokeStyle = OUT; g.stroke(); } }
function P(pts, f, lw) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); if (f) { g.fillStyle = f; g.fill(); } if (lw !== 0) { g.lineWidth = lw || 2.4; g.strokeStyle = OUT; g.lineJoin = 'round'; g.stroke(); } }
function RR(x, y, w, h, r, f, lw) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); if (f) { g.fillStyle = f; g.fill(); } if (lw !== 0) { g.lineWidth = lw || 2.4; g.strokeStyle = OUT; g.stroke(); } }
function L(x1, y1, x2, y2, c, w) { g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = OUT; g.lineWidth = w + 2.6; g.stroke(); g.strokeStyle = c; g.lineWidth = w; g.stroke(); }
function eye(x, y, r, px, col) { E(x, y, r, r * 1.15, '#fff', 1.6); E(x + (px || 0), y + .5, r * .5, r * .6, col || OUT, 0); }
function star(x, y, r1, r2, n, f, rot) { const p = []; for (let i = 0; i < n * 2; i++) { const a = (rot || 0) + i * Math.PI / n, r = i % 2 ? r2 : r1; p.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } P(p, f, 2.5); }


/* ---------- sprites (pasta herois/ ao lado do index.html; se faltarem, usa os desenhos em código) ---------- */
const SPM = {"quixote":[[200,340,0.479],[340,280,0.371]],"holmes":[[173,340,0.384],[354,312,0.37]],"dracula":[[149,340,0.5],[382,319,0.476]],"alice":[[184,340,0.418],[320,320,0.337]],"nemo":[[202,340,0.457],[333,320,0.331]],"adamastor":[[256,340,0.522],[336,323,0.476]],"traca":[[357,340,0.503],[338,316,0.492]],"rato":[[292,340,0.554],[337,302,0.58]],"bolor":[[380,340,0.496],[418,288,0.662]],"censor":[[219,340,0.605],[334,331,0.46]],"queimador":[[237,340,0.563],[375,310,0.599]],"sombra":[[212,340,0.579],[390,300,0.585]]}; // id: [[w,h,âncoraX] parado, [w,h,âncoraX] ataque]
const SPR = {};
// aceita a pasta "herois" ou "heróis"
function imgSrc(im, f) { im.onerror = () => { if (!im.alt) { im.alt = 1; im.src = 'her%C3%B3is/' + f; } }; im.src = 'herois/' + f; }
Object.keys(SPM).forEach(id => ['i', 'a'].forEach((p, k) => { const im = new Image(); im.onload = () => { im.ok = true; }; imgSrc(im, id + '_' + p + '.webp?v=1'); (SPR[id] = SPR[id] || [])[k] = im; }));
const eH = e => (sprOK(e.type) ? EH[e.type] / 1.4 + (e.type === 'traca' ? 30 : 0) : (ED[e.type].fly ? 64 : 58)) * e.size * (e.shrinkT > 0 ? .62 : 1);
const sprOK = id => SPR[id] && SPR[id][0] && SPR[id][0].ok;
const EH = { traca: 52, rato: 46, bolor: 52, censor: 76, queimador: 74, sombra: 70 }; // altura no ecrã com size 1
// desenha a pose (0 parado, 1 ataque) com os pés em (0,0); dh = altura da pose parada no ecrã
function sprDraw(id, pose, dh) {
  const im = SPR[id][pose] && SPR[id][pose].ok ? SPR[id][pose] : SPR[id][0], m = SPM[id][im === SPR[id][0] ? 0 : 1], k = dh / SPM[id][0][1];
  g.drawImage(im, -m[2] * m[0] * k, -m[1] * k, m[0] * k, m[1] * k);
}
/* ---------- animações fotograma a fotograma (vídeos do Veo) ---------- */
const SPA = { quixote: {"idle":{"fw":200,"fh":306,"n":12,"cols":6,"ax":91.0,"fy":304.6,"ih":300.0},"walk":{"fw":321,"fh":293,"n":12,"cols":6,"ax":130.8,"fy":290.9,"ih":284.9},"atk":{"fw":542,"fh":305,"n":18,"cols":6,"ax":137.5,"fy":303.6,"ih":300.0,"strike":9}} };
Object.keys(SPA).forEach(id => Object.keys(SPA[id]).forEach(k => { const a = SPA[id][k], im = new Image(); im.onload = () => { a.ok = true; }; imgSrc(im, id + '_' + k + '.webp?v=1'); a.img = im; }));
const animOK = id => !!(SPA[id] && SPA[id].idle.ok && SPA[id].atk.ok);
const ATK_DUR = .62;
const aStrike = id => animOK(id) ? SPA[id].atk.strike / SPA[id].atk.n * ATK_DUR : STRIKE;
const aDur = id => animOK(id) ? ATK_DUR : ANIM;
function animDraw(a, i, dh) {          // pés em (0,0); dh = altura da pose parada no ecrã
  const k = dh / a.ih, c = i % a.cols, r = Math.floor(i / a.cols);
  g.drawImage(a.img, c * a.fw, r * a.fh, a.fw, a.fh, -a.ax * k, -a.fy * k, a.fw * k, a.fh * k);
}
function heroAnim(id, t, st) {
  const A = SPA[id], ph = id.length * 1.7;
  if (!st.dead && st.aT != null && st.aT < ATK_DUR) return animDraw(A.atk, Math.min(A.atk.n - 1, Math.floor(st.aT / ATK_DUR * A.atk.n)), 68);
  if (!st.dead && st.walk && A.walk.ok) return animDraw(A.walk, Math.floor(t * 13 + ph) % A.walk.n, 68);
  const n = A.idle.n, L = 2 * n - 2, j = Math.floor(t * 8 + ph) % L;
  animDraw(A.idle, st.dead ? 0 : (j < n ? j : L - j), 68);
