<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Corvo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --gold:#d9a441; --bg:#0b0716; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:Georgia,'Times New Roman',serif; color:#efe9ff; }
  #stage { position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .panel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:86%; text-align:center;
           padding:20px 16px; border-radius:18px; background:rgba(14,9,30,.82); border:1px solid rgba(217,164,65,.45);
           backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .panel h1,.panel h2 { margin:0 0 8px; color:var(--gold); letter-spacing:1px; }
  .panel h1 { font-size:34px; } .panel h2 { font-size:26px; }
  .panel p { margin:6px 0 0; font-size:15px; opacity:.85; line-height:1.4; }
  #ready { pointer-events:none; top:22%; }
  #ready button { pointer-events:auto; }
  .picks { margin:10px 0 2px; font-size:15px; line-height:1.7; }
  .picks b { color:#fff; }
  .tap { margin-top:10px; font-size:17px; color:var(--gold); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .scores { display:flex; justify-content:center; gap:28px; margin:10px 0 14px; }
  .scores div { font-size:13px; opacity:.8; text-transform:uppercase; letter-spacing:1px; }
  .scores b { display:block; font-size:34px; color:#fff; opacity:1; letter-spacing:0; }
  button { font-family:inherit; font-size:17px; border:0; border-radius:12px; padding:12px 18px; margin:4px; cursor:pointer; }
  .btn2 { background:rgba(255,255,255,.1); color:#efe9ff; border:1px solid rgba(255,255,255,.2); font-size:15px; padding:9px 14px; }
  #again, #pickok { background:var(--gold); color:#1a1030; font-weight:bold; }
  #over { top:2%; transform:translate(-50%,0); max-height:96%; overflow-y:auto; }
  .top { margin:0 0 12px; text-align:left; font-size:13px; line-height:1.55; }
  .top.hidden { display:none; }
  .toph { text-align:center; color:var(--gold); font-weight:bold; margin-bottom:4px; letter-spacing:1px; }
  .top .row { display:flex; gap:8px; padding:1px 6px; border-radius:6px; }
  .top .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top .row .pt { font-weight:bold; }
  .top .row.me { background:rgba(217,164,65,.25); }
  #mute { position:absolute; top:10px; right:10px; width:40px; height:40px; padding:0; margin:0; border-radius:50%;
          background:rgba(14,9,30,.6); color:#fff; font-size:18px; border:1px solid rgba(255,255,255,.15); z-index:5; }
  /* escolha dos pássaros */
  #pick { top:2%; transform:translate(-50%,0); padding:14px 10px 12px; }
  #pick h2 { font-size:22px; margin-bottom:4px; }
  .plabel { margin:8px 0 4px; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); text-align:left; padding-left:2px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .card { border:2px solid rgba(255,255,255,.12); border-radius:10px; padding:2px 2px 3px; background:rgba(255,255,255,.04); cursor:pointer; }
  .card canvas { position:static; inset:auto; width:100%; height:auto; aspect-ratio:120/92; display:block; }
  .card span { display:block; font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.sel { border-color:var(--gold); background:rgba(217,164,65,.2); }
  .card.dis { opacity:.3; }
  .pinfo { min-height:64px; margin:8px 0 2px; font-size:12.5px; line-height:1.35; opacity:.9; white-space:pre-line; }
  .rv { color:#ff6b6b; font-weight:bold; font-size:14px; margin:4px 0 6px; }
  .tabs { display:flex; gap:6px; justify-content:center; margin-bottom:6px; }
  .tabs span { flex:1; padding:5px 6px; white-space:nowrap; border-radius:12px; background:rgba(255,255,255,.1); font-size:12px; cursor:pointer; }
  .tabs span.on { background:var(--gold); color:#1a1030; font-weight:bold; }
  .dif { margin:6px 0 4px; font-size:15px; }
  .picks.small { font-size:12.5px; line-height:1.4; opacity:.85; white-space:pre-line; margin:4px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Som">🔊</button>
  <div id="ready" class="panel">
    <h1>Flappy Corvo</h1>
    <p>Passa entre as pilhas de livros<br>sem tocar em nada.</p>
    <div class="picks">Tu voas: <b id="pn"></b><br>Atrapalha-te: <b id="hn"></b></div>
    <div id="rv" class="rv hidden">⚔️ Rivais! Abusos x10 e vale tudo.</div>
    <div class="picks small" id="tr"></div>
    <div class="dif">🎲 Dificuldade aleatória em cada voo!</div>
    <button id="change" class="btn2">🐦 Trocar pássaros</button>
    <div class="tap">Toca para voar</div>
  </div>
  <div id="pick" class="panel hidden">
    <h2>Escolhe os pássaros</h2>
    <div class="tabs" id="ptabs"><span data-r="p" class="on"></span><span data-r="h"></span></div>
    <div class="grid" id="gridP"></div>
    <div class="grid hidden" id="gridH"></div>
    <div class="pinfo" id="pinfo">Toca num pássaro para o escolher.</div>
    <button id="pickok">Voar!</button>
  </div>
  <div id="over" class="panel hidden">
    <h2>Fim de voo</h2>
    <div class="scores">
      <div>Pontos<b id="sc">0</b></div>
      <div>Recorde<b id="bs">0</b></div>
    </div>
    <div class="picks" id="mi"></div>
    <div id="top" class="top hidden"></div>
    <button id="again">Jogar outra vez</button>
    <button id="share" class="btn2">Partilhar</button>
    <button id="chg2" class="btn2">🐦 Pássaros</button>
  </div>
</div>

<script>
/* ====== CONFIG ====== */
const CONFIG = {
  // Link do teu bot/app para o botão "Partilhar" (ex.: https://t.me/o_teu_bot/jogo). Vazio = usa o URL da página.
  shareLink: '',
  // Asneiras dos pássaros (PT-PT). Mete false para uma versão sem palavrões.
  asneiras: true,
  // URL público do servidor do bot (Railway) para o top de jogadores. Vazio = sem top.
  apiUrl: 'https://rxbot-production-0047.up.railway.app'
};

/* ====== TELEGRAM ====== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#0b0716'); tg.setBackgroundColor('#0b0716');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}
const haptic = (kind, v) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind](v); } catch (e) {} };

/* ====== ARMAZENAMENTO (recorde e escolhas) ====== */
function lsGet(k) { try { return parseInt(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsGetS(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function cloudOK() { return tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'); }
function loadBest(cb) {
  const local = lsGet('corvo_best');
  if (cloudOK()) {
    try { tg.CloudStorage.getItem('corvo_best', (err, v) => cb(Math.max(local, parseInt(v) || 0))); return; } catch (e) {}
  }
  cb(local);
}
function saveBest(v) {
  lsSet('corvo_best', v);
  if (cloudOK()) { try { tg.CloudStorage.setItem('corvo_best', String(v)); } catch (e) {} }
}

/* ====== SOM ====== */
let actx, muted = lsGet('corvo_muted') === 1;
function beep(f, d, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(n + d);
  } catch (e) {}
}
// Grito de cada pássaro quando perde (sintetizado, não precisa de ficheiros de áudio)
const CRY = {
  corvo: [0, 1, 2].map(i => ({ at: [0, .33, .64][i], d: i === 2 ? .46 : .27, f0: 860 - i * 80, f1: (860 - i * 80) * .42, lf: 68 + i * 9, ld: 110, lt: 'square', b0: 1600, b1: 650, q: 2.2 })),
  ju: [
    { at: 0, d: .24, ty: 'square', f0: 560, f1: 400, b0: 1000, b1: 800, q: 3, v: .7, lf: 30, ld: 20 },
    { at: .32, d: .3, ty: 'square', f0: 520, f1: 330, b0: 1000, b1: 700, q: 3, v: .7, lf: 30, ld: 20 }],
  aguia: [
    { at: 0, d: .5, f0: 2300, f1: 1250, lf: 55, ld: 140, b0: 2600, b1: 1500, q: 3 },
    { at: .55, d: .45, f0: 2000, f1: 1100, lf: 60, ld: 140, b0: 2400, b1: 1300, q: 3 }],
  dragao: [
    { at: 0, d: 1.0, f0: 150, f1: 55, lf: 30, ld: 25, b0: 420, b1: 200, q: 1.2 },
    { at: 0, d: 1.0, ty: 'square', f0: 96, f1: 46, v: .5, b0: 300, b1: 150, q: 1 }],
  fenix: [
    { at: 0, d: .32, ty: 'triangle', f0: 700, f1: 2100, v: .7 },
    { at: .38, d: .36, ty: 'triangle', f0: 900, f1: 2500, v: .7 },
    { at: 0, d: .75, f0: 1700, f1: 1500, lf: 120, ld: 800, lt: 'square', v: .22, b0: 2000, b1: 1500, q: 1 }],
  pomba: [
    { at: 0, d: .3, ty: 'sine', f0: 430, f1: 340, lf: 7, ld: 14, v: .6 },
    { at: .36, d: .3, ty: 'sine', f0: 440, f1: 340, lf: 7, ld: 14, v: .6 },
    { at: .72, d: .42, ty: 'sine', f0: 420, f1: 300, lf: 7, ld: 14, v: .6 }],
  morcego: [0, .12, .24, .36, .48].map(at => ({ at, d: .08, ty: 'sine', f0: 5400 - at * 1200, f1: 3800, v: .55 })),
  conde: [
    { at: 0, d: .2, f0: 270, f1: 190, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .24, d: .2, f0: 250, f1: 175, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .48, d: .2, f0: 230, f1: 160, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .72, d: .2, f0: 210, f1: 145, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .96, d: .4, f0: 190, f1: 80, lf: 6, ld: 10, b0: 700, b1: 400, q: 2 }],
  liberdade: [
    { at: 0, d: .4, f0: 2600, f1: 1500, lf: 60, ld: 150, b0: 2800, b1: 1700, q: 3 },
    { at: .45, d: .35, f0: 2200, f1: 1300, lf: 55, ld: 130, b0: 2500, b1: 1500, q: 3 },
    { at: .85, d: .3, f0: 2400, f1: 1400, lf: 55, ld: 130, b0: 2500, b1: 1500, q: 3 }],
  pato: [
    { at: 0, d: .16, f0: 540, f1: 330, b0: 1400, b1: 900, q: 2.5, v: .9 },
    { at: .22, d: .16, f0: 520, f1: 320, b0: 1400, b1: 900, q: 2.5, v: .9 },
    { at: .44, d: .24, f0: 480, f1: 250, b0: 1300, b1: 800, q: 2.5, v: .9 }],
  mocho: [
    { at: 0, d: .35, ty: 'sine', f0: 420, f1: 360, lf: 5, ld: 10, v: .8 },
    { at: .5, d: .35, ty: 'sine', f0: 400, f1: 340, lf: 5, ld: 10, v: .8 },
    { at: 1.0, d: .55, ty: 'sine', f0: 390, f1: 290, lf: 5, ld: 10, v: .8 }],
  abutre: [
    { at: 0, d: .8, f0: 300, f1: 140, lf: 90, ld: 90, b0: 1800, b1: 700, q: 1.2, v: .6 },
    { at: .1, d: .7, ty: 'square', f0: 210, f1: 110, v: .3, b0: 900, b1: 500, q: 1 }],
  tucano: [
    { at: 0, d: .3, ty: 'square', f0: 700, f1: 450, lf: 40, ld: 80, b0: 1500, b1: 900, q: 2, v: .6 },
    { at: .4, d: .3, ty: 'square', f0: 650, f1: 420, lf: 40, ld: 80, b0: 1500, b1: 900, q: 2, v: .6 },
    { at: .8, d: .4, ty: 'square', f0: 620, f1: 380, lf: 40, ld: 80, b0: 1400, b1: 800, q: 2, v: .6 }],
  picapau: [0, .07, .14, .21, .28, .35, .5, .57, .64].map(at => ({ at, d: .05, ty: 'square', f0: 900, f1: 300, b0: 1200, b1: 600, q: 3, v: .8 })),
  dodo: [
    { at: 0, d: .5, f0: 180, f1: 120, lf: 14, ld: 20, b0: 700, b1: 400, q: 2 },
    { at: .6, d: .6, f0: 170, f1: 100, lf: 14, ld: 20, b0: 700, b1: 400, q: 2 }],
  arara: [
    { at: 0, d: .35, f0: 1500, f1: 900, lf: 50, ld: 200, b0: 2000, b1: 1200, q: 2.5 },
    { at: .4, d: .3, f0: 1300, f1: 800, lf: 50, ld: 200, b0: 2000, b1: 1200, q: 2.5 },
    { at: .8, d: .4, f0: 1600, f1: 900, lf: 50, ld: 200, b0: 2000, b1: 1200, q: 2.5 }]
};
function cry(id) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, master = actx.createGain();
    master.gain.value = 1; master.connect(actx.destination);
    (CRY[id] || CRY.corvo).forEach(n => {
      const s = t0 + n.at, d = n.d;
      const o = actx.createOscillator(); o.type = n.ty || 'sawtooth';
      o.frequency.setValueAtTime(n.f0, s);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, n.f1), s + d);
      let node = o;
      if (n.lf) {
        const l = actx.createOscillator(); l.type = n.lt || 'sine'; l.frequency.value = n.lf;
        const lg = actx.createGain(); lg.gain.value = n.ld || 0;
        l.connect(lg); lg.connect(o.frequency); l.start(s); l.stop(s + d + .03);
      }
      if (n.b0) {
        const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = n.q || 2;
        f.frequency.setValueAtTime(n.b0, s); f.frequency.exponentialRampToValueAtTime(n.b1 || n.b0, s + d);
        node.connect(f); node = f;
      }
      const g = actx.createGain(), v = n.v == null ? 1 : n.v;
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(v, s + .02);
      g.gain.exponentialRampToValueAtTime(.0001, s + d);
      node.connect(g); g.connect(master); o.start(s); o.stop(s + d + .03);
    });
  } catch (e) {}
}

// Voz: síntese de voz do telemóvel, só se houver voz pt-PT instalada (evita sotaque brasileiro)
const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let ptVoice = null, voicesListed = false, ttsUnlocked = false;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices() || [];
  voicesListed = vs.length > 0;
  ptVoice = vs.find(v => /^pt[-_]PT/i.test(v.lang)) || null;
}
if (hasTTS) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function unlockTTS() {
  if (!hasTTS || ttsUnlocked) return; ttsUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
function stopSpeech() { if (hasTTS) { try { speechSynthesis.cancel(); } catch (e) {} } }
function tts(text, pitch, rate) {
  if (muted || !hasTTS) return;
  if (voicesListed && !ptVoice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-PT'; if (ptVoice) u.voice = ptVoice;
    u.pitch = pitch || 0.45; u.rate = rate || 0.92; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const muteBtn = document.getElementById('mute');
muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.addEventListener('pointerdown', e => {
  e.stopPropagation(); muted = !muted; lsSet('corvo_muted', muted ? 1 : 0); if (muted) stopSpeech();
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

/* ====== CANVAS ====== */
const W = 360, H = 640, GROUND = 72, PW = 70;
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (H * scale) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();
/* ====== PERSONAGENS ====== */
const TAU = Math.PI * 2;
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function poly(c, p) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); }
function fs(c) { c.fill(); c.stroke(); }
function dot(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }

// asa de membrana (dragão, morcego, capa do conde)
function membrane(c, wy, k, fill, stroke, fg) {
  const W1 = [-15 * k, wy * k - 13 * k], T1 = [-35 * k, wy * 1.35 * k - 5], T2 = [-31 * k, wy * k + 9], T3 = [-21 * k, wy * .65 * k + 12];
  c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-4, -4); c.lineTo(W1[0], W1[1]); c.lineTo(T1[0], T1[1]);
  c.quadraticCurveTo(-27 * k, wy * 1.1 * k + 1, T2[0], T2[1]);
  c.quadraticCurveTo(-24 * k, wy * .8 * k + 9, T3[0], T3[1]);
  c.quadraticCurveTo(-12 * k, wy * .4 * k + 10, -5, 5);
  c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = fg || stroke; c.lineWidth = 1;
  c.beginPath(); c.moveTo(W1[0], W1[1]); c.lineTo(T2[0], T2[1]); c.moveTo(W1[0], W1[1]); c.lineTo(T3[0], T3[1]); c.stroke();
}
// asa de ave com "dedos" (águia)
function featherWing(c, wy, k, fill, stroke) {
  c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-4, -3);
  c.quadraticCurveTo(-14 * k, wy * k - 10, -33 * k, wy * 1.3 * k - 4);
  c.lineTo(-27 * k, wy * 1.2 * k + 3); c.lineTo(-32 * k, wy * k + 8);
  c.lineTo(-22 * k, wy * .8 * k + 8); c.lineTo(-25 * k, wy * .5 * k + 13);
  c.lineTo(-11 * k, 8); c.lineTo(2, 4); c.closePath(); c.fill(); c.stroke();
}
function flame(c, x, y, len, wd, col, ph, tt, dir) {
  const fk = Math.sin(tt * .5 + ph);
  c.fillStyle = col; c.beginPath(); c.moveTo(x, y - wd);
  c.quadraticCurveTo(x + dir * len * .5, y - wd * .6 + fk * 2, x + dir * len, y + fk * 4);
  c.quadraticCurveTo(x + dir * len * .5, y + wd * .6 + fk * 2, x, y + wd);
  c.closePath(); c.fill();
}
function flameUp(c, x, y, len, wd, col, ph, tt) {
  c.save(); c.translate(x, y); c.rotate(-Math.PI / 2 - .25); flame(c, 0, 0, len, wd, col, ph, tt, 1); c.restore();
}

// Cada desenho: origem no centro do corpo, vira para a direita. w = batida de asa (-1..1), m = boca aberta (0..1), tt = tempo
const DRAW = {
  corvo(c, w, m) {
    c.fillStyle = '#0c0816'; poly(c, [-12, -2, -31, -6, -28, 1, -32, 8, -12, 5]); c.fill();
    c.fillStyle = '#14101f'; c.strokeStyle = '#5a49a0'; c.lineWidth = 1.5;

}

function drawChar(c, id, x, y, o) {
  const ch = CHARS[id];
  c.save(); c.globalAlpha = o.a == null ? 1 : o.a;
  c.translate(x, y); c.rotate(o.rot || 0); c.scale(o.s, o.s);
  if (o.glow !== false) {
    const g = c.createRadialGradient(0, 0, 4, 0, 0, 38), q = ch.gl;
    g.addColorStop(0, 'rgba(' + q[0] + ',' + q[1] + ',' + q[2] + ',' + q[3] + ')');
    g.addColorStop(1, 'rgba(' + q[0] + ',' + q[1] + ',' + q[2] + ',0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 38, 0, TAU); c.fill();
  }
  c.lineCap = 'round'; c.lineJoin = 'round';
  ch.draw(c, o.w || 0, o.m || 0, o.tt || 0);
  c.restore();
}

function rollH() {
  if (hSel !== 'rand') { sel.h = hSel; return; }
  const opts = ORDER.filter(i => i !== sel.p && i !== sel.h);

function pool(id, key) {
  return (CHARS[id][key] || []).filter(s => CONFIG.asneiras || s[0] !== '*').map(s => s[0] === '*' ? s.slice(1) : s);
}
function fmt(s, n) {
  return s.replace(/\{h\}/g, HI().name).replace(/\{p\}/g, PL().name).replace(/\{n\}/g, n == null ? '' : n);
}
function rnd(arr) {
  if (!arr.length) return '';
  let s = arr[(Math.random() * arr.length) | 0];
  if (arr.length > 1 && s === lastLine) s = arr[(Math.random() * arr.length) | 0];
  lastLine = s; return s;
}
function say(who, text, ms, voice) {
  const ch = who === 'p' ? PL() : HI();
  text = fmt(text);
  if (ch.bang) text = text.replace(/[.!?…\s]+$/, '') + '!!'; // a Ju acaba sempre com !!
  SP[who].text = text; SP[who].until = performance.now() + (ms || 2600);
  if (voice) tts(text, ch.pitch, ch.rate);
}

/* ====== LÓGICA ====== */
function update(dt) {
  t += dt;
  const nowMs = performance.now();
  if (isTalking('p') || nowMs < cawUntil) bird.mouth = 0.5 + 0.5 * Math.sin(nowMs * 0.03); else bird.mouth *= 0.7;
  if (SP.p.text && nowMs >= SP.p.until) SP.p.text = null;
  updateAmbient(dt);
  updateHD(nowMs, dt);
  bird.wing += dt * (state === 'playing' ? 0.38 : 0.16);
  const speed = (2.3 + Math.min(score * 0.04, 1.2)) * (on('turbo') ? 1.3 : 1) * (PT().spd || 1);
  updateMode(nowMs, dt);
  updateSpecials(nowMs, dt);

  if (state === 'ready' || state === 'pick') {
    scroll += 1.2 * dt;
    bird.y = 330 + Math.sin(t * 0.07) * 8; bird.rot = 0;
  } else if (state === 'playing') {
    scroll += speed * dt;
    bird.vy = Math.min(bird.vy + (PT().grav || 0.42) * dt, 9);
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.075));
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

    if (!pipes.length || pipes[pipes.length - 1].x <= W - (on('turbo') ? 208 : 160)) pipes.push(makePipe());
    for (const p of pipes) {
      p.x -= speed * dt;
      if (p.amp) p.gapY = p.g0 + Math.sin(t * 0.035 + p.ph) * p.amp;
      if (!p.passed && p.x + PW < bird.x - bird.r) {
        p.passed = true; score++;
        if ([5, 10, 15, 20, 30, 50].includes(score)) say('p', rnd(pool(sel.p, 'p')).replace(/\{n\}/g, score), 2200, true);
        beep(880, .12, 'triangle', .05, 300); haptic('impactOccurred', 'soft');
      }
    }
    pipes = pipes.filter(p => p.x > -PW - 10);

    const r = bird.r - 2;
    if (bird.y + r >= H - GROUND) { bird.y = H - GROUND - r; die('ground'); }
    for (const p of pipes) {
      const pi = PW * (1 - (PT().pw || 1)) / 2;
      if (bird.x + r > p.x + pi && bird.x - r < p.x + PW - pi &&
          (bird.y - r < p.gapY - p.gap / 2 || bird.y + r > p.gapY + p.gap / 2)) { die('pipe'); break; }
    }
  } else if (state === 'over') {
    bird.vy = Math.min(bird.vy + 0.5 * dt, 12);
    bird.y += bird.vy * dt;
    bird.rot = Math.min(bird.rot + 0.08 * dt, 1.5);
    const floor = H - GROUND - bird.r;
    if (bird.y > floor) { bird.y = floor; bird.vy = 0; }
  }

  for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 0.18 * dt; f.vx *= 0.985; f.life -= 0.012 * dt; f.rot += 0.1 * dt; }
  feathers = feathers.filter(f => f.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 0.6 * dt);
}
