<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Corvo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --gold:#d9a441; --bg:#0b0716; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:Georgia,'Times New Roman',serif; color:#efe9ff; }
  #stage { position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .panel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:86%; text-align:center;
           padding:20px 16px; border-radius:18px; background:rgba(14,9,30,.82); border:1px solid rgba(217,164,65,.45);
           backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .panel h1,.panel h2 { margin:0 0 8px; color:var(--gold); letter-spacing:1px; }
  .panel h1 { font-size:34px; } .panel h2 { font-size:26px; }
  .panel p { margin:6px 0 0; font-size:15px; opacity:.85; line-height:1.4; }
  #ready { pointer-events:none; top:22%; }
  #ready button { pointer-events:auto; }
  .picks { margin:10px 0 2px; font-size:15px; line-height:1.7; }
  .picks b { color:#fff; }
  .tap { margin-top:10px; font-size:17px; color:var(--gold); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .scores { display:flex; justify-content:center; gap:28px; margin:10px 0 14px; }
  .scores div { font-size:13px; opacity:.8; text-transform:uppercase; letter-spacing:1px; }
  .scores b { display:block; font-size:34px; color:#fff; opacity:1; letter-spacing:0; }
  button { font-family:inherit; font-size:17px; border:0; border-radius:12px; padding:12px 18px; margin:4px; cursor:pointer; }
  .btn2 { background:rgba(255,255,255,.1); color:#efe9ff; border:1px solid rgba(255,255,255,.2); font-size:15px; padding:9px 14px; }
  #again, #pickok { background:var(--gold); color:#1a1030; font-weight:bold; }
  #over { top:2%; transform:translate(-50%,0); max-height:96%; overflow-y:auto; }
  .top { margin:0 0 12px; text-align:left; font-size:13px; line-height:1.55; }
  .top.hidden { display:none; }
  .toph { text-align:center; color:var(--gold); font-weight:bold; margin-bottom:4px; letter-spacing:1px; }
  .top .row { display:flex; gap:8px; padding:1px 6px; border-radius:6px; }
  .top .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top .row .pt { font-weight:bold; }
  .top .row.me { background:rgba(217,164,65,.25); }
  #mute { position:absolute; top:10px; right:10px; width:40px; height:40px; padding:0; margin:0; border-radius:50%;
          background:rgba(14,9,30,.6); color:#fff; font-size:18px; border:1px solid rgba(255,255,255,.15); z-index:5; }
  /* escolha dos pássaros */
  #pick { top:2%; transform:translate(-50%,0); padding:14px 10px 12px; }
  #pick h2 { font-size:22px; margin-bottom:4px; }
  .plabel { margin:8px 0 4px; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); text-align:left; padding-left:2px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .card { border:2px solid rgba(255,255,255,.12); border-radius:10px; padding:2px 2px 3px; background:rgba(255,255,255,.04); cursor:pointer; }
  .card canvas { position:static; inset:auto; width:100%; height:auto; aspect-ratio:120/92; display:block; }
  .card span { display:block; font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.sel { border-color:var(--gold); background:rgba(217,164,65,.2); }
  .card.dis { opacity:.3; }
  .pinfo { min-height:34px; margin:8px 0 2px; font-size:13px; line-height:1.35; opacity:.9; }
  .rv { color:#ff6b6b; font-weight:bold; font-size:14px; margin:4px 0 6px; }
  .tabs { display:flex; gap:6px; justify-content:center; margin-bottom:6px; }
  .tabs span { padding:3px 12px; border-radius:12px; background:rgba(255,255,255,.1); font-size:12px; cursor:pointer; }
  .tabs span.on { background:var(--gold); color:#1a1030; font-weight:bold; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Som">🔊</button>
  <div id="ready" class="panel">
    <h1>Flappy Corvo</h1>
    <p>Passa entre as pilhas de livros<br>sem tocar em nada.</p>
    <div class="picks">Tu voas: <b id="pn"></b><br>Atrapalha-te: <b id="hn"></b></div>
    <div id="rv" class="rv hidden">⚔️ Rivais! Abusos x10 e vale tudo.</div>
    <button id="change" class="btn2">🐦 Trocar pássaros</button>
    <div class="tap">Toca para voar</div>
  </div>
  <div id="pick" class="panel hidden">
    <h2>Escolhe os pássaros</h2>
    <div class="plabel">🕊️ Tu voas</div>
    <div class="grid" id="gridP"></div>
    <div class="plabel">😈 Atrapalha-te</div>
    <div class="grid" id="gridH"></div>
    <div class="pinfo" id="pinfo">Toca num pássaro para o escolher.</div>
    <button id="pickok">Voar!</button>
  </div>
  <div id="over" class="panel hidden">
    <h2>Fim de voo</h2>
    <div class="scores">
      <div>Pontos<b id="sc">0</b></div>
      <div>Recorde<b id="bs">0</b></div>
    </div>
    <div id="top" class="top hidden"></div>
    <button id="again">Jogar outra vez</button>
    <button id="share" class="btn2">Partilhar</button>
    <button id="chg2" class="btn2">🐦 Pássaros</button>
  </div>
</div>

<script>
/* ====== CONFIG ====== */
const CONFIG = {
  // Link do teu bot/app para o botão "Partilhar" (ex.: https://t.me/o_teu_bot/jogo). Vazio = usa o URL da página.
  shareLink: '',
  // Asneiras dos pássaros (PT-PT). Mete false para uma versão sem palavrões.
  asneiras: true,
  // URL público do servidor do bot (Railway) para o top de jogadores. Vazio = sem top.
  apiUrl: 'https://rxbot-production-0047.up.railway.app'
};

/* ====== TELEGRAM ====== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#0b0716'); tg.setBackgroundColor('#0b0716');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}
const haptic = (kind, v) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind](v); } catch (e) {} };

/* ====== ARMAZENAMENTO (recorde e escolhas) ====== */
function lsGet(k) { try { return parseInt(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsGetS(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function cloudOK() { return tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'); }
function loadBest(cb) {
  const local = lsGet('corvo_best');
  if (cloudOK()) {
    try { tg.CloudStorage.getItem('corvo_best', (err, v) => cb(Math.max(local, parseInt(v) || 0))); return; } catch (e) {}
  }
  cb(local);
}
function saveBest(v) {
  lsSet('corvo_best', v);
  if (cloudOK()) { try { tg.CloudStorage.setItem('corvo_best', String(v)); } catch (e) {} }
}

/* ====== SOM ====== */
let actx, muted = lsGet('corvo_muted') === 1;
function beep(f, d, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(n + d);
  } catch (e) {}
}
// Grito de cada pássaro quando perde (sintetizado, não precisa de ficheiros de áudio)
const CRY = {
  corvo: [0, 1, 2].map(i => ({ at: [0, .33, .64][i], d: i === 2 ? .46 : .27, f0: 860 - i * 80, f1: (860 - i * 80) * .42, lf: 68 + i * 9, ld: 110, lt: 'square', b0: 1600, b1: 650, q: 2.2 })),
  ju: [
    { at: 0, d: .24, ty: 'square', f0: 560, f1: 400, b0: 1000, b1: 800, q: 3, v: .7, lf: 30, ld: 20 },
    { at: .32, d: .3, ty: 'square', f0: 520, f1: 330, b0: 1000, b1: 700, q: 3, v: .7, lf: 30, ld: 20 }],
  aguia: [
    { at: 0, d: .5, f0: 2300, f1: 1250, lf: 55, ld: 140, b0: 2600, b1: 1500, q: 3 },
    { at: .55, d: .45, f0: 2000, f1: 1100, lf: 60, ld: 140, b0: 2400, b1: 1300, q: 3 }],
  dragao: [
    { at: 0, d: 1.0, f0: 150, f1: 55, lf: 30, ld: 25, b0: 420, b1: 200, q: 1.2 },
    { at: 0, d: 1.0, ty: 'square', f0: 96, f1: 46, v: .5, b0: 300, b1: 150, q: 1 }],
  fenix: [
    { at: 0, d: .32, ty: 'triangle', f0: 700, f1: 2100, v: .7 },
    { at: .38, d: .36, ty: 'triangle', f0: 900, f1: 2500, v: .7 },
    { at: 0, d: .75, f0: 1700, f1: 1500, lf: 120, ld: 800, lt: 'square', v: .22, b0: 2000, b1: 1500, q: 1 }],
  pomba: [
    { at: 0, d: .3, ty: 'sine', f0: 430, f1: 340, lf: 7, ld: 14, v: .6 },
    { at: .36, d: .3, ty: 'sine', f0: 440, f1: 340, lf: 7, ld: 14, v: .6 },
    { at: .72, d: .42, ty: 'sine', f0: 420, f1: 300, lf: 7, ld: 14, v: .6 }],
  morcego: [0, .12, .24, .36, .48].map(at => ({ at, d: .08, ty: 'sine', f0: 5400 - at * 1200, f1: 3800, v: .55 })),
  conde: [
    { at: 0, d: .2, f0: 270, f1: 190, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .24, d: .2, f0: 250, f1: 175, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .48, d: .2, f0: 230, f1: 160, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .72, d: .2, f0: 210, f1: 145, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .96, d: .4, f0: 190, f1: 80, lf: 6, ld: 10, b0: 700, b1: 400, q: 2 }]
};
function cry(id) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, master = actx.createGain();
    master.gain.value = 1; master.connect(actx.destination);
    (CRY[id] || CRY.corvo).forEach(n => {
      const s = t0 + n.at, d = n.d;
      const o = actx.createOscillator(); o.type = n.ty || 'sawtooth';
      o.frequency.setValueAtTime(n.f0, s);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, n.f1), s + d);
      let node = o;
      if (n.lf) {
        const l = actx.createOscillator(); l.type = n.lt || 'sine'; l.frequency.value = n.lf;
        const lg = actx.createGain(); lg.gain.value = n.ld || 0;
        l.connect(lg); lg.connect(o.frequency); l.start(s); l.stop(s + d + .03);
      }
      if (n.b0) {
        const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = n.q || 2;
        f.frequency.setValueAtTime(n.b0, s); f.frequency.exponentialRampToValueAtTime(n.b1 || n.b0, s + d);
        node.connect(f); node = f;
      }
      const g = actx.createGain(), v = n.v == null ? 1 : n.v;
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(v, s + .02);
      g.gain.exponentialRampToValueAtTime(.0001, s + d);
      node.connect(g); g.connect(master); o.start(s); o.stop(s + d + .03);
    });
  } catch (e) {}
}

// Voz: síntese de voz do telemóvel, só se houver voz pt-PT instalada (evita sotaque brasileiro)
const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let ptVoice = null, voicesListed = false, ttsUnlocked = false;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices() || [];
  voicesListed = vs.length > 0;
  ptVoice = vs.find(v => /^pt[-_]PT/i.test(v.lang)) || null;
}
if (hasTTS) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function unlockTTS() {
  if (!hasTTS || ttsUnlocked) return; ttsUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
function stopSpeech() { if (hasTTS) { try { speechSynthesis.cancel(); } catch (e) {} } }
function tts(text, pitch, rate) {
  if (muted || !hasTTS) return;
  if (voicesListed && !ptVoice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-PT'; if (ptVoice) u.voice = ptVoice;
    u.pitch = pitch || 0.45; u.rate = rate || 0.92; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const muteBtn = document.getElementById('mute');
muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.addEventListener('pointerdown', e => {
  e.stopPropagation(); muted = !muted; lsSet('corvo_muted', muted ? 1 : 0); if (muted) stopSpeech();
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

/* ====== CANVAS ====== */
const W = 360, H = 640, GROUND = 72, PW = 70;
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (H * scale) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();
/* ====== PERSONAGENS ====== */
const TAU = Math.PI * 2;
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function poly(c, p) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); }
function fs(c) { c.fill(); c.stroke(); }
function dot(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }

// asa de membrana (dragão, morcego, capa do conde)
function membrane(c, wy, k, fill, stroke, fg) {
  const W1 = [-15 * k, wy * k - 13 * k], T1 = [-35 * k, wy * 1.35 * k - 5], T2 = [-31 * k, wy * k + 9], T3 = [-21 * k, wy * .65 * k + 12];
  c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-4, -4); c.lineTo(W1[0], W1[1]); c.lineTo(T1[0], T1[1]);
  c.quadraticCurveTo(-27 * k, wy * 1.1 * k + 1, T2[0], T2[1]);
  c.quadraticCurveTo(-24 * k, wy * .8 * k + 9, T3[0], T3[1]);
  c.quadraticCurveTo(-12 * k, wy * .4 * k + 10, -5, 5);
  c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = fg || stroke; c.lineWidth = 1;
  c.beginPath(); c.moveTo(W1[0], W1[1]); c.lineTo(T2[0], T2[1]); c.moveTo(W1[0], W1[1]); c.lineTo(T3[0], T3[1]); c.stroke();
}
// asa de ave com "dedos" (águia)
function featherWing(c, wy, k, fill, stroke) {
  c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-4, -3);
  c.quadraticCurveTo(-14 * k, wy * k - 10, -33 * k, wy * 1.3 * k - 4);
  c.lineTo(-27 * k, wy * 1.2 * k + 3); c.lineTo(-32 * k, wy * k + 8);
  c.lineTo(-22 * k, wy * .8 * k + 8); c.lineTo(-25 * k, wy * .5 * k + 13);
  c.lineTo(-11 * k, 8); c.lineTo(2, 4); c.closePath(); c.fill(); c.stroke();
}
function flame(c, x, y, len, wd, col, ph, tt, dir) {
  const fk = Math.sin(tt * .5 + ph);
  c.fillStyle = col; c.beginPath(); c.moveTo(x, y - wd);
  c.quadraticCurveTo(x + dir * len * .5, y - wd * .6 + fk * 2, x + dir * len, y + fk * 4);
  c.quadraticCurveTo(x + dir * len * .5, y + wd * .6 + fk * 2, x, y + wd);
  c.closePath(); c.fill();
}
function flameUp(c, x, y, len, wd, col, ph, tt) {
  c.save(); c.translate(x, y); c.rotate(-Math.PI / 2 - .25); flame(c, 0, 0, len, wd, col, ph, tt, 1); c.restore();
}

// Cada desenho: origem no centro do corpo, vira para a direita. w = batida de asa (-1..1), m = boca aberta (0..1), tt = tempo
const DRAW = {
  corvo(c, w, m) {
    c.fillStyle = '#0c0816'; poly(c, [-12, -2, -31, -6, -28, 1, -32, 8, -12, 5]); c.fill();
    c.fillStyle = '#14101f'; c.strokeStyle = '#5a49a0'; c.lineWidth = 1.5;
    ell(c, 0, 0, 17, 11); fs(c);
    c.beginPath(); c.arc(13, -6, 8, 0, TAU); fs(c);
    c.fillStyle = '#d9a441'; poly(c, [19, -9, 32, -5 - m * 3, 19, -4.5]); c.fill();
    c.fillStyle = '#b88830'; poly(c, [19, -4.5, 30, -3 + m * 6, 19, -.5 + m]); c.fill();
    dot(c, 15, -8, 2.3, '#ffd36b'); dot(c, 15.6, -8, 1, '#000');
    const wy = w * 12; c.fillStyle = '#1e1736'; c.strokeStyle = '#6b58b8';
    c.beginPath(); c.moveTo(-6, -2); c.quadraticCurveTo(-18, wy - 6, -27, wy * 1.3);
    c.quadraticCurveTo(-8, wy * .4 + 6, 4, 3); c.closePath(); fs(c);
  },

  ju(c, w, m) {
    const f = w;
    const wing = (dark, k) => {
      const tipX = -26 * k, tipY = -12 - 30 * f * k;
      c.fillStyle = dark ? '#e86f92' : '#ff9db8';
      c.beginPath(); c.moveTo(8, -6);
      c.quadraticCurveTo(-2, tipY * .55 - 8, tipX, tipY);
      c.quadraticCurveTo(-16, tipY * .35 + 8, -14, 0);
      c.closePath(); c.fill();
      c.fillStyle = '#2a1d3a'; poly(c, [tipX, tipY, tipX + 9, tipY * .6 - 2, tipX + 11, tipY * .6 + 6]); c.fill();
    };
    wing(true, .85);
    c.strokeStyle = '#e0607f'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(-16, 3); c.lineTo(-56, 9 + f * 3); c.stroke();
    c.beginPath(); c.moveTo(-14, 6); c.lineTo(-52, 16 + f * 3); c.stroke();
    c.fillStyle = '#ff86a6'; ell(c, 0, 0, 22, 11, -.05); c.fill();
    poly(c, [-18, -3, -34, 0, -18, 5]); c.fill();
    c.strokeStyle = '#ff86a6'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(16, -4); c.bezierCurveTo(30, -14, 30, -2, 44, -16); c.stroke();
    const hx = 46, hy = -18;
    dot(c, hx, hy, 6.5, '#ff86a6'); dot(c, hx + 2.5, hy - 2, 1.7, '#1a1030');
    c.fillStyle = '#f6d9cf'; c.beginPath(); c.moveTo(hx + 3, hy - 4);
    c.quadraticCurveTo(hx + 15, hy - 4, hx + 16, hy + 4 - m * 2); c.lineTo(hx + 3, hy + 1); c.closePath(); c.fill();
    c.fillStyle = '#2a1d3a'; poly(c, [hx + 12, hy - 1, hx + 16, hy + 4 - m * 2, hx + 10, hy + 1]); c.fill();
    c.fillStyle = '#f0cfc4'; poly(c, [hx + 3, hy + 1, hx + 13, hy + 4 + m * 6, hx + 3, hy + 5]); c.fill();
    wing(false, 1);
  },

  aguia(c, w, m) {
    const wy = w * 14;
    featherWing(c, wy, .85, '#4b321b', '#2e1d0e');
    c.fillStyle = '#f1ece0'; c.strokeStyle = '#bdb59f'; c.lineWidth = 1.3;
    poly(c, [-12, -3, -33, -8, -36, 0, -33, 8, -12, 5]); fs(c);

function pool(id, key) {
  return (CHARS[id][key] || []).filter(s => CONFIG.asneiras || s[0] !== '*').map(s => s[0] === '*' ? s.slice(1) : s);
}
function fmt(s, n) {
  return s.replace(/\{h\}/g, HI().name).replace(/\{p\}/g, PL().name).replace(/\{n\}/g, n == null ? '' : n);
}
function rnd(arr) {
  if (!arr.length) return '';
  let s = arr[(Math.random() * arr.length) | 0];
  if (arr.length > 1 && s === lastLine) s = arr[(Math.random() * arr.length) | 0];
  lastLine = s; return s;
}
function say(who, text, ms, voice) {
  const ch = who === 'p' ? PL() : HI();
  text = fmt(text);
  if (ch.bang) text = text.replace(/[.!?…\s]+$/, '') + '!!'; // a Ju acaba sempre com !!
  SP[who].text = text; SP[who].until = performance.now() + (ms || 2600);
  if (voice) tts(text, ch.pitch, ch.rate);
}
const isTalking = who => SP[who].text && performance.now() < SP[who].until;

const HD = { fx: 292, fy: 330, mouth: 0, n: 0, next: Infinity, nextBomb: Infinity, bombing: false, bombUntil: 0, replyAt: 0, shove: 0, shoveAt: Infinity, shoveT: 0, shoveDir: 1 };
let gloatTimer = null;
const hdFront = () => HD.bombing || HD.shove === 2;
function updateHD(now, dt) {
  if (isTalking('h')) HD.mouth = 0.5 + 0.5 * Math.sin(now * 0.028); else HD.mouth *= 0.7;
  if (SP.h.text && now >= SP.h.until) SP.h.text = null;
  let tx, ty;
  if (state === 'playing') {
    const R = rv();
    if (!HD.bombing && now > HD.nextBomb) { HD.bombing = true; HD.bombUntil = now + (R ? 1200 : 1600); }
    if (HD.bombing && now > HD.bombUntil) { HD.bombing = false; HD.nextBomb = now + (R ? 3000 + Math.random() * 2500 : 9000 + Math.random() * 7000); }
    // rivais: empurrões de propósito (avisa com ⚠ e a seta da direção)
    if (R) {
      if (HD.shove === 0 && now > HD.shoveAt) { HD.shove = 1; HD.shoveT = now + 750; HD.shoveDir = Math.random() < 0.5 ? -1 : 1; haptic('notificationOccurred', 'warning'); }
      else if (HD.shove === 1 && now > HD.shoveT) { HD.shove = 2; HD.shoveT = now + 450; }
      else if (HD.shove === 2) {
        const d = Math.hypot(HD.fx - bird.x, HD.fy - bird.y);
        if (d < 26 || now > HD.shoveT) {
          if (d < 42) { bird.vy += HD.shoveDir * 3.4; shake = 6; beep(150, .15, 'sawtooth', .06, -60); haptic('impactOccurred', 'heavy'); }
          HD.shove = 0; HD.shoveAt = now + 4500 + Math.random() * 2500;
        }
      }
    } else HD.shove = 0;
    let k;
    if (HD.shove === 1) { tx = bird.x - 70; ty = bird.y; k = 0.1; }
    else if (HD.shove === 2) { tx = bird.x + 4; ty = bird.y; k = 0.28; }
    else {
      if (HD.bombing) { tx = bird.x + 8; ty = bird.y - 4; }
      else { tx = bird.x - 52 + Math.sin(t * 0.02) * 16; ty = bird.y - 30 + Math.sin(t * 0.037) * 32; }
      k = HD.bombing ? 0.12 : 0.07;
    }
    ty = Math.max(50, Math.min(H - GROUND - 70, ty));
    k = Math.min(1, k * dt);
    HD.fx += (tx - HD.fx) * k; HD.fy += (ty - HD.fy) * k;
    if (now > HD.next && (R || !isTalking('p'))) {
      const line = R ? rnd(pool(sel.h, 'x')) : HD.n === 0 ? rnd(pool(sel.h, 'in')) : rnd(pool(sel.h, 't'));
      HD.n++; say('h', line, R ? 2000 : 2800, true);
      HD.next = now + (R ? 4200 + Math.random() * 1000 : 7000 + Math.random() * 4000);
      if (R) HD.replyAt = now + 2200;
      else if (HD.n > 1 && Math.random() < 0.5) HD.replyAt = now + 2900; // quem voa responde
    }
    if (HD.replyAt && now > HD.replyAt) {
      if (R || !isTalking('p')) say('p', rnd(pool(sel.p, R ? 'xr' : 'r')), R ? 2000 : 2200, true);
      HD.replyAt = 0;
    }
  } else {
    HD.bombing = false;
    tx = 292; ty = 300 + Math.sin(t * 0.05) * 14;
    const k = Math.min(1, 0.05 * dt);
    HD.fx += (tx - HD.fx) * k; HD.fy += (ty - HD.fy) * k;
  }
}

const bats = Array.from({ length: 3 }, (_, i) => ({ x: 80 + i * 150 + Math.random() * 60, y: 70 + Math.random() * 250, v: 0.5 + Math.random() * 0.5, ph: Math.random() * 6, s: 0.8 + Math.random() * 0.5 }));
let star = null, nextStar = 300;
function updateAmbient(dt) {
  for (const b of bats) {
    b.x -= b.v * dt * 1.4; b.y += Math.sin(t * 0.03 + b.ph) * 0.3 * dt;
    if (b.x < -40) { b.x = W + 30 + Math.random() * 160; b.y = 70 + Math.random() * 250; b.v = 0.5 + Math.random() * 0.5; }
  }
  if (!star && t > nextStar) star = { x: 140 + Math.random() * 220, y: 20 + Math.random() * 90, life: 0 };
  if (star) {
    star.life += dt; star.x -= 6 * dt; star.y += 3 * dt;
    if (star.life > 50) { star = null; nextStar = t + 450 + Math.random() * 450; }
  }
}
function drawAmbient() {
  if (star) {
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - star.life / 50);
    const g = ctx.createLinearGradient(star.x, star.y, star.x + 60, star.y - 30);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(star.x, star.y); ctx.lineTo(star.x + 60, star.y - 30); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#2f1d57';
  for (const b of bats) {
    const f = Math.sin(t * 0.35 + b.ph);
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.s, b.s);
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 3.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, -3); ctx.lineTo(-2, -9); ctx.lineTo(0, -3); ctx.moveTo(0, -3); ctx.lineTo(2, -9); ctx.lineTo(4, -3); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * 3, -1);
      ctx.quadraticCurveTo(s * 12, -10 * f - 5, s * 21, -3 * f + 3);
      ctx.quadraticCurveTo(s * 15, 1, s * 12, 5);
      ctx.quadraticCurveTo(s * 8, 1, s * 3, 4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function makePipe() {
  const gap = Math.max(138, 176 - score * 1.5);
  const min = 120 + gap / 2, max = H - GROUND - 110 - gap / 2;
  const mkBooks = () => Array.from({ length: 30 }, () => ({
    h: 18 + Math.random() * 14, j: (Math.random() * 10 - 5) | 0, c: PALETTE[(Math.random() * PALETTE.length) | 0], band: Math.random() < .6
  }));
  return { x: W + 40, gapY: min + Math.random() * (max - min), gap, passed: false, top: mkBooks(), bot: mkBooks() };
}

/* ====== TOP DE JOGADORES (precisa do servidor do bot) ====== */
function renderTop(data, which) {
  which = which === 'grp' && data.group ? 'grp' : 'all';
  const src = which === 'grp' ? data.group : data;
  topEl.textContent = '';
  const h = document.createElement('div'); h.className = 'toph';
  if (data.group) {
    const tabs = document.createElement('div'); tabs.className = 'tabs';
    [['all', '🌍 Geral'], ['grp', '👥 Grupo']].forEach(([k, label]) => {
      const sp = document.createElement('span'); sp.textContent = label; if (k === which) sp.className = 'on';
      sp.addEventListener('click', () => renderTop(data, k)); tabs.appendChild(sp);
    });
    topEl.appendChild(tabs);
  }
  h.textContent = which === 'grp' ? '🏆 TOP 10 DO GRUPO' : '🏆 TOP 10 GERAL'; topEl.appendChild(h);
  const medals = ['🥇', '🥈', '🥉'];
  const addRow = (pos, name, pts, me) => {
    const row = document.createElement('div'); row.className = 'row' + (me ? ' me' : '');
    const a = document.createElement('span'); a.textContent = pos;
    const b = document.createElement('span'); b.className = 'nm'; b.textContent = name;
    const c = document.createElement('span'); c.className = 'pt'; c.textContent = pts;
    row.append(a, b, c); topEl.appendChild(row);
  };
  (src.top || []).forEach((r, i) => addRow(medals[i] || (i + 1) + '.', r.name, r.score, r.me));
  if (src.you && src.you.rank > 10) addRow('#' + src.you.rank, 'Tu', src.you.best, true);
  topEl.classList.remove('hidden');
}
async function submitScore() {
  if (!CONFIG.apiUrl) return;
  topEl.classList.remove('hidden');
  if (!tg || !tg.initData) { topEl.textContent = 'Abre o jogo pelo Telegram para ver o top.'; return; }
  topEl.textContent = 'A carregar o top…';
  try {
    const res = await fetch(CONFIG.apiUrl.replace(/\/$/, '') + '/api/score', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg.initData, score: score, dur: Math.round(lastDur),
        chat: (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''
      })
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    try { localStorage.setItem('corvo_top', JSON.stringify(data)); } catch (e) {}
    renderTop(data);
  } catch (e) {
    let old = null;
    try { old = JSON.parse(localStorage.getItem('corvo_top') || 'null'); } catch (e2) {}
    if (old && old.top) { renderTop(old); const n = document.createElement('div'); n.className = 'toph'; n.style.opacity = '.6'; n.textContent = '(último top guardado — servidor sem resposta)'; topEl.appendChild(n); }
    else topEl.textContent = 'Top indisponível (' + String((e && e.message) || 'erro') + ').';
  }
}

/* ====== ECRÃ DE ESCOLHA ====== */
const thumbs = [];
let pickBuilt = false, lastPicked = null;
function buildPick() {
  if (pickBuilt) return; pickBuilt = true;
  [['gridP', 'p'], ['gridH', 'h']].forEach(([gid, role]) => {
    const grid = document.getElementById(gid);
    ORDER.forEach((id, i) => {
      const card = document.createElement('div'); card.className = 'card'; card.dataset.id = id; card.dataset.role = role;
      const cvs = document.createElement('canvas'); cvs.width = 240; cvs.height = 184;
      const lab = document.createElement('span'); lab.textContent = CHARS[id].name;
      card.append(cvs, lab); grid.appendChild(card);
      thumbs.push({ id, role, i, c: cvs.getContext('2d'), card });
      card.addEventListener('click', () => choose(role, id));
    });
  });
}
function choose(role, id) {
  const other = role === 'p' ? 'h' : 'p';
  if (sel[other] === id) return;
  sel[role] = id; lastPicked = id; refreshPick();
}
function refreshPick() {
  for (const th of thumbs) {
    const other = th.role === 'p' ? 'h' : 'p';
    th.card.classList.toggle('sel', sel[th.role] === th.id);
    th.card.classList.toggle('dis', sel[other] === th.id);
  }
  const ch = CHARS[lastPicked] || PL();
  document.getElementById('pinfo').textContent = rv() ? '⚔️ Rivais! Abusos x10 e vale tudo para te fazer perder.' : ch.emoji + ' ' + ch.name + ' — ' + ch.bio;
}
function drawThumbs() {
  for (const th of thumbs) {
    const c = th.c, ch = CHARS[th.id];
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 240, 184);
    c.setTransform(2, 0, 0, 2, 0, 0);
    drawChar(c, th.id, 60 + ch.tox, 46 + ch.toy + Math.sin(t * 0.07 + th.i) * 2.5,
      { s: ch.ts, rot: -0.05, w: Math.sin(t * 0.25 + th.i), m: 0, tt: t, glow: true });
  }
}
function openPick() {
  clearTimeout(deathTimer); clearTimeout(gloatTimer); stopSpeech(); cawUntil = 0;
  buildPick(); resetGame(); state = 'pick';
  SP.p.text = null; SP.h.text = null;
  readyEl.classList.add('hidden'); overEl.classList.add('hidden'); pickEl.classList.remove('hidden');
  lastPicked = null; refreshPick();
}
document.getElementById('pickok').addEventListener('click', () => {
  lsSet('corvo_p', sel.p); lsSet('corvo_h', sel.h); showReady();
});
document.getElementById('change').addEventListener('click', openPick);
document.getElementById('chg2').addEventListener('click', openPick);

/* ====== INPUT ====== */
stage.addEventListener('pointerdown', e => {
  unlockTTS();
  if (e.target.closest('button, .card, .tabs')) return;
  if (state === 'pick') return;
  e.preventDefault();
  if (state === 'over') { if (performance.now() - overAt > 900) showReady(); return; }
  flap();
});
document.getElementById('again').addEventListener('click', () => { showReady(); });
document.getElementById('share').addEventListener('click', () => {
  const text = `${PL().emoji} Fiz ${score} pontos no Flappy Corvo como ${PL().name}! Consegues bater-me?`;
  const link = CONFIG.shareLink || location.href;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else if (navigator.share) navigator.share({ text, url: link }).catch(() => {});
  else window.open(url, '_blank');
});
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
    unlockTTS();
    e.preventDefault();
    if (state === 'pick') return;
    if (state === 'over') { if (performance.now() - overAt > 900) showReady(); } else flap();
  }
});

/* ====== LÓGICA ====== */
function update(dt) {
  t += dt;
  const nowMs = performance.now();
  if (isTalking('p') || nowMs < cawUntil) bird.mouth = 0.5 + 0.5 * Math.sin(nowMs * 0.03); else bird.mouth *= 0.7;
  if (SP.p.text && nowMs >= SP.p.until) SP.p.text = null;
  updateAmbient(dt);
  updateHD(nowMs, dt);
  bird.wing += dt * (state === 'playing' ? 0.38 : 0.16);
  const speed = 2.3 + Math.min(score * 0.04, 1.2);

  if (state === 'ready' || state === 'pick') {
    scroll += 1.2 * dt;
    bird.y = 330 + Math.sin(t * 0.07) * 8; bird.rot = 0;
  } else if (state === 'playing') {
    scroll += speed * dt;
    bird.vy = Math.min(bird.vy + 0.42 * dt, 9);
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.075));
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

    if (!pipes.length || pipes[pipes.length - 1].x <= W - 160) pipes.push(makePipe());
    for (const p of pipes) {
      p.x -= speed * dt;
      if (!p.passed && p.x + PW < bird.x - bird.r) {
        p.passed = true; score++;
        if ([5, 10, 15, 20, 30, 50].includes(score)) say('p', rnd(pool(sel.p, 'p')).replace(/\{n\}/g, score), 2200, true);
        beep(880, .12, 'triangle', .05, 300); haptic('impactOccurred', 'soft');
      }
    }
    pipes = pipes.filter(p => p.x > -PW - 10);

    const r = bird.r - 2;
    if (bird.y + r >= H - GROUND) { bird.y = H - GROUND - r; die(); }
    for (const p of pipes) {
      if (bird.x + r > p.x && bird.x - r < p.x + PW &&
          (bird.y - r < p.gapY - p.gap / 2 || bird.y + r > p.gapY + p.gap / 2)) { die(); break; }
    }
  } else if (state === 'over') {
    bird.vy = Math.min(bird.vy + 0.5 * dt, 12);
    bird.y += bird.vy * dt;
    bird.rot = Math.min(bird.rot + 0.08 * dt, 1.5);
    const floor = H - GROUND - bird.r;
    if (bird.y > floor) { bird.y = floor; bird.vy = 0; }
  }

  for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 0.18 * dt; f.vx *= 0.985; f.life -= 0.012 * dt; f.rot += 0.1 * dt; }
  feathers = feathers.filter(f => f.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 0.6 * dt);
}

/* ====== DESENHO ====== */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0618'); g.addColorStop(.6, '#1b0f36'); g.addColorStop(1, '#3a1740');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.02 + s.p));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  const mg = ctx.createRadialGradient(270, 110, 20, 270, 110, 110);
  mg.addColorStop(0, 'rgba(255,240,200,.35)'); mg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(270, 110, 110, 0, 7); ctx.fill();
  ctx.fillStyle = '#f4ecd0'; ctx.beginPath(); ctx.arc(270, 110, 34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(160,150,120,.35)';
  [[258, 100, 7], [281, 120, 5], [275, 94, 4], [262, 124, 3]].forEach(c => { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, 7); ctx.fill(); });
}
function drawTowers(color, par, hMul, offset) {
  const base = H - GROUND, off = -((scroll * par) % 720);
  ctx.fillStyle = color;
  for (let k = 0; k < 2; k++) {
    for (let i = 0; i < 12; i++) {
      const w = 34 + ((i * 7 + offset) % 5) * 4;
      const h = (70 + ((i * 53 + offset * 17) % 100)) * hMul;
      const x = off + k * 720 + i * 60;
      if (x > W + 60 || x < -80) continue;
      ctx.fillRect(x, base - h, w, h);
      ctx.beginPath(); ctx.moveTo(x - 3, base - h); ctx.lineTo(x + w / 2, base - h - w * 0.95); ctx.lineTo(x + w + 3, base - h); ctx.fill();
      if (i % 3 === 0 && hMul > 0.9) {
        ctx.fillStyle = 'rgba(255,207,107,.75)'; ctx.fillRect(x + w / 2 - 2, base - h + 22, 4, 8);
        ctx.fillStyle = color;
      }
    }
  }
}
function drawMist() {
  for (let i = 0; i < 4; i++) {
    const x = (((i * 190 - scroll * 0.45) % 760) + 760) % 760 - 160;
    const g = ctx.createRadialGradient(x, H - GROUND - 40, 5, x, H - GROUND - 40, 130);
    g.addColorStop(0, 'rgba(150,110,210,.16)'); g.addColorStop(1, 'rgba(150,110,210,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 130, H - GROUND - 170, 260, 200);
  }
}
function drawBook(x, y, w, h, b) {
  ctx.fillStyle = b.c; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x, y + h - 2, w, 2);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x, y, 6, h); ctx.fillRect(x + w - 6, y, 6, h);
  if (b.band) { ctx.fillStyle = 'rgba(217,164,65,.8)'; ctx.fillRect(x + 10, y + h / 2 - 1, w - 20, 2); }
}
function drawPipe(p) {
  const w = PW - 8;
  let y = p.gapY + p.gap / 2;
  for (const b of p.bot) { if (y > H) break; drawBook(p.x + 4 + b.j, y, w, b.h, b); y += b.h; }
  y = p.gapY - p.gap / 2;
  for (const b of p.top) { if (y < -40) break; drawBook(p.x + 4 + b.j, y - b.h, w, b.h, b); y -= b.h; }
}
function drawGround() {
  const y = H - GROUND;
  ctx.fillStyle = '#0d0818'; ctx.fillRect(0, y, W, GROUND);
  ctx.fillStyle = '#2a1d4a'; ctx.fillRect(0, y, W, 3);
  ctx.fillStyle = '#1a1230';
  const o = scroll % 32;
  for (let x = -o; x < W; x += 32) {
    ctx.fillRect(x, y + 12, 28, 14);
    ctx.fillRect(x + 16, y + 32, 28, 14);
  }
}
function drawPlayer() {
  drawChar(ctx, sel.p, bird.x, bird.y, { s: PL().ps, rot: bird.rot, w: Math.sin(bird.wing), m: bird.mouth, tt: t });
}
function drawHinderer(front) {
  const ch = HI();
  drawChar(ctx, sel.h, HD.fx, HD.fy, {
    s: ch.hs * (front ? 1.3 : 1), a: front ? 0.8 : 0.95,
    rot: Math.sin(t * 0.05) * 0.06 - 0.04, w: Math.sin(t * 0.3), m: HD.mouth, tt: t
  });
}
function drawFeathers() {
  for (const f of feathers) {
    ctx.save(); ctx.globalAlpha = Math.max(0, f.life); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.fillStyle = f.c || '#2a2145'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 2, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}
function drawSubtitles() {
  // Legendas na faixa do chão (fora da zona de jogo), para não taparem os pássaros nem os obstáculos
  const now = performance.now(), rows = [];
  if (SP.p.text && now < SP.p.until) rows.push({ who: PL().name, col: PL().col, text: SP.p.text, a: Math.min(1, (SP.p.until - now) / 300) });
  if (SP.h.text && now < SP.h.until) rows.push({ who: HI().name, col: HI().col, text: SP.h.text, a: Math.min(1, (SP.h.until - now) / 300) });
  if (!rows.length) return;
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  rows.forEach((r, i) => {
    const y = H - GROUND + 22 + i * 30, label = r.who + ': ';
    let size = 15, tw = 0;
    for (; size >= 10; size--) {
      ctx.font = 'bold ' + size + 'px Georgia, serif';
      tw = ctx.measureText(label + r.text).width;
      if (tw <= W - 32) break;
    }
    ctx.globalAlpha = r.a;
    ctx.fillStyle = 'rgba(8,4,18,.78)'; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(8, y - 13, tw + 20, 26, 9); else ctx.rect(8, y - 13, tw + 20, 26);
    ctx.fill();
    ctx.fillStyle = r.col; ctx.fillText(label, 18, y);
    ctx.fillStyle = '#fff'; ctx.fillText(r.text, 18 + ctx.measureText(label).width, y);
  });
  ctx.restore();
}
function drawScore() {
  if (state === 'ready' || state === 'pick') return;
  ctx.font = 'bold 54px Georgia, serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(10,6,24,.9)'; ctx.strokeText(score, W / 2, 96);
  ctx.fillStyle = '#fff'; ctx.fillText(score, W / 2, 96);
}

/* ====== ESTÁDIOS (águia e dragão têm o seu campo) ====== */
const THEMES = {
  aguia: { acc: '#d3202b', trim: '#f4f1ea', sky: ['#0b0710', '#26101a', '#4a1620'] },
  dragao: { acc: '#1f5fd0', trim: '#f4f1ea', sky: ['#060b1a', '#0d1b3a', '#14306a'] }
};
function theme() { const a = PL().bg ? PL() : HI().bg ? HI() : null; return a ? THEMES[a.bg] : null; }
function drawStadium(th) {
  const y0 = H - GROUND - 200, yb = H - GROUND;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(.55, th.sky[1]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = .25 + .4 * Math.abs(Math.sin(t * 0.02 + s.p)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y * .8, s.s, s.s); }
  ctx.globalAlpha = 1;
  // projetores
  for (let i = 0; i < 3; i++) {
    const x = (((i * 190 - scroll * 0.12) % 570) + 570) % 570 - 70;
    const cg = ctx.createLinearGradient(x, 70, x, y0 + 60);
    cg.addColorStop(0, 'rgba(255,250,220,.24)'); cg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(x - 16, 64); ctx.lineTo(x + 16, 64); ctx.lineTo(x + 95, y0 + 70); ctx.lineTo(x - 95, y0 + 70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a1d2e'; ctx.fillRect(x - 2, 80, 4, y0 - 60);
    ctx.fillStyle = '#262a40'; ctx.fillRect(x - 17, 56, 34, 18);
    ctx.fillStyle = '#fffbe6';
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) { ctx.beginPath(); ctx.arc(x - 12 + c * 8, 61 + r * 9, 2.4, 0, 7); ctx.fill(); }
  }
  // bancada
  ctx.fillStyle = '#0b0e1a'; ctx.fillRect(0, y0, W, yb - y0);
  ctx.fillStyle = th.acc; ctx.fillRect(0, y0 - 6, W, 6);
  const fo = (scroll * 0.3) % 24;
  for (let i = -1; i < 16; i++) {
    const x = i * 24 - fo, f = Math.sin(t * 0.12 + i) * 2;
    ctx.fillStyle = (((i + Math.floor(scroll * 0.3 / 24)) % 2 + 2) % 2) ? th.acc : th.trim;
    ctx.beginPath(); ctx.moveTo(x, y0 - 6); ctx.lineTo(x + 11, y0 - 12 + f); ctx.lineTo(x, y0 - 19); ctx.fill();
  }
  const co = (scroll * 0.15) % 18, cb = Math.floor(scroll * 0.15 / 18);
  for (let r = 0; r < 7; r++) {
    const yy = y0 + 16 + r * 24;
    for (let i = -1; i < 22; i++) {
      const col = i + cb, h = ((col * 37 + r * 101) % 7 + 7) % 7;
      const x = i * 18 - co + (r % 2) * 9, bob = h < 5 ? Math.sin(t * 0.12 + col) * 1.8 : 0;
      ctx.fillStyle = h < 3 ? th.acc : h < 5 ? th.trim : '#2a2f4a';
      ctx.fillRect(x - 4, yy + 3 + bob, 8, 10); ctx.beginPath(); ctx.arc(x, yy + bob, 3.5, 0, 7); ctx.fill();
      if (((((t * 0.4) | 0) + col * 3 + r * 5) % 83) === 0) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x, yy - 3, 5, 0, 7); ctx.fill(); }
    }
  }
  // painéis publicitários
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, yb - 26, W, 26);
  const po = (scroll * 0.6) % 180;
  for (let i = -1; i < 4; i++) {
    const x = i * 90 - po;
    ctx.fillStyle = (((i + Math.floor(scroll * 0.6 / 90)) % 2 + 2) % 2) ? th.acc : th.trim;
    ctx.fillRect(x + 3, yb - 22, 84, 18);
  }
  // marcador
  if (state !== 'ready') {
    ctx.fillStyle = '#05060d'; ctx.strokeStyle = '#3a3f5c'; ctx.lineWidth = 2; ctx.fillRect(10, 14, 124, 30); ctx.strokeRect(10, 14, 124, 30);
    ctx.font = 'bold 13px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffcf6b'; ctx.fillText('NÓS ' + score + ' – 0 ELES', 72, 30); ctx.textBaseline = 'alphabetic';
  }
}
function drawGroundStadium() {
  const y = H - GROUND;
  ctx.fillStyle = '#14502a'; ctx.fillRect(0, y, W, GROUND);
  const o = scroll % 72;
  ctx.fillStyle = '#1a6234';
  for (let x = -o; x < W; x += 72) ctx.fillRect(x, y, 36, GROUND);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(0, y, W, 3);
}
function drawWarning() {
  if (HD.shove !== 1 || Math.floor(performance.now() / 120) % 2) return;
  ctx.save(); ctx.font = 'bold 26px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff4d4d';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,6,24,.9)';
  const txt = '⚠ ' + (HD.shoveDir < 0 ? '↑' : '↓');
  ctx.strokeText(txt, bird.x, bird.y - 36); ctx.fillText(txt, bird.x, bird.y - 36); ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  const th = state === 'pick' ? null : theme();
  if (th) drawStadium(th);
  else {
    drawSky();
    drawAmbient();
    drawTowers('#1c1236', 0.12, 0.8, 3);
    drawTowers('#130b27', 0.25, 1.0, 0);
    drawMist();
  }
  if (state !== 'pick') {
    if (!hdFront()) drawHinderer(false);
    for (const p of pipes) drawPipe(p);
    if (th) drawGroundStadium(); else drawGround();
    drawFeathers();
    drawPlayer();
    if (hdFront()) drawHinderer(true); // fotobomb / empurrão à frente
    drawWarning();
    drawSubtitles();
    drawScore();
  } else {
    drawGround();
  }
  ctx.restore();
  if (state === 'pick') drawThumbs();
}

/* ====== LOOP ====== */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 16.667, 2.5); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (hadChoice) showReady(); else openPick();

</script>
