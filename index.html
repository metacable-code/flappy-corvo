<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Corvo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --gold:#d9a441; --bg:#0b0716; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; touch-action:none; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:Georgia,'Times New Roman',serif; color:#efe9ff; }
  #stage { position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .panel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:86%; text-align:center;
           padding:20px 16px; border-radius:18px; background:rgba(14,9,30,.82); border:1px solid rgba(217,164,65,.45);
           backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .panel h1,.panel h2 { margin:0 0 8px; color:var(--gold); letter-spacing:1px; }
  .panel h1 { font-size:34px; } .panel h2 { font-size:26px; }
  .panel p { margin:6px 0 0; font-size:15px; opacity:.85; line-height:1.4; }
  #ready { pointer-events:none; top:27%; }
  #ready button { pointer-events:auto; }
  .picks { margin:10px 0 2px; font-size:15px; line-height:1.7; }
  .picks b { color:#fff; }
  .tap { margin-top:10px; font-size:17px; color:var(--gold); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .scores { display:flex; justify-content:center; gap:28px; margin:10px 0 14px; }
  .scores div { font-size:13px; opacity:.8; text-transform:uppercase; letter-spacing:1px; }
  .scores b { display:block; font-size:34px; color:#fff; opacity:1; letter-spacing:0; }
  button { font-family:inherit; font-size:17px; border:0; border-radius:12px; padding:12px 18px; margin:4px; cursor:pointer; }
  .btn2 { background:rgba(255,255,255,.1); color:#efe9ff; border:1px solid rgba(255,255,255,.2); font-size:15px; padding:9px 14px; }
  #again, #pickok { background:var(--gold); color:#1a1030; font-weight:bold; }
  #over { top:2%; transform:translate(-50%,0); max-height:96%; overflow-y:auto; }
  .top { margin:0 0 12px; text-align:left; font-size:13px; line-height:1.55; }
  .top.hidden { display:none; }
  .toph { text-align:center; color:var(--gold); font-weight:bold; margin-bottom:4px; letter-spacing:1px; }
  .top .row { display:flex; gap:8px; padding:1px 6px; border-radius:6px; }
  .top .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top .row .pt { font-weight:bold; }
  .top .row.me { background:rgba(217,164,65,.25); }
  #mute { position:absolute; top:10px; right:10px; width:40px; height:40px; padding:0; margin:0; border-radius:50%;
          background:rgba(14,9,30,.6); color:#fff; font-size:18px; border:1px solid rgba(255,255,255,.15); z-index:5; }
  /* escolha dos pássaros */
  #pick { top:2%; transform:translate(-50%,0); padding:14px 10px 12px; }
  #pick h2 { font-size:22px; margin-bottom:4px; }
  .plabel { margin:8px 0 4px; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); text-align:left; padding-left:2px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:332px; overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain; padding-right:2px; }
  .card { border:2px solid rgba(255,255,255,.12); border-radius:10px; padding:2px 2px 3px; background:rgba(255,255,255,.04); cursor:pointer; }
  .card canvas { position:static; inset:auto; width:100%; height:auto; aspect-ratio:120/92; display:block; }
  .card span { display:block; font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.sel { border-color:var(--gold); background:rgba(217,164,65,.2); }
  .card.dis { opacity:.3; }
  .pinfo { min-height:72px; margin:8px 0 2px; font-size:12.5px; line-height:1.35; opacity:.9; white-space:pre-line; }
  .rv { color:#ff6b6b; font-weight:bold; font-size:14px; margin:4px 0 6px; }
  .tabs { display:flex; gap:6px; justify-content:center; margin-bottom:6px; }
  .tabs span { flex:1; padding:5px 6px; white-space:nowrap; border-radius:12px; background:rgba(255,255,255,.1); font-size:12px; cursor:pointer; }
  .tabs span.on { background:var(--gold); color:#1a1030; font-weight:bold; }
  .dif { margin:6px 0 4px; font-size:15px; }
  .picks.small { font-size:12.5px; line-height:1.4; opacity:.85; white-space:pre-line; margin:4px 0; }
  .card { position:relative; }
  .card .pr { position:absolute; top:2px; right:2px; font-style:normal; font-size:10px; font-weight:bold; color:#ffd25a; background:rgba(10,6,24,.82); border-radius:8px; padding:1px 4px; }
  .card .pr:empty { display:none; }
  .card.lock canvas { filter:brightness(.45) grayscale(.5); }
  #pick h2 { display:flex; justify-content:space-between; align-items:baseline; font-size:18px; white-space:nowrap; padding:0 42px 0 4px; }
  .wal { font-size:15px; color:#ffd25a; font-weight:bold; letter-spacing:0; }
  #buy { background:#ffd25a; color:#1a1030; font-weight:bold; }
  #buy.poor { background:rgba(255,255,255,.12); color:#efe9ff; border:1px solid rgba(255,255,255,.25); font-weight:normal; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Som">🔊</button>
  <div id="ready" class="panel">
    <h1>Flappy Corvo</h1>
    <p>Passa entre as pilhas de livros<br>sem tocar em nada.</p>
    <div class="picks">Tu voas: <b id="pn"></b><br>Atrapalha-te: <b id="hn"></b></div>
    <div id="rv" class="rv hidden">⚔️ Rivais! Abusos x10 e vale tudo.</div>
    <div class="picks small" id="tr"></div>
    <div class="dif">🎲 Dificuldade aleatória em cada voo!</div>
    <div class="picks small" id="wl" style="color:#ffd25a"></div>
    <button id="change" class="btn2">🐦 Trocar pássaros</button>
    <div class="tap">Toca para voar</div>
  </div>
  <div id="pick" class="panel hidden">
    <h2><span>Escolhe os pássaros</span><span id="wal" class="wal"></span></h2>
    <div class="tabs" id="ptabs"><span data-r="p" class="on"></span><span data-r="h"></span></div>
    <div class="grid" id="gridP"></div>
    <div class="grid hidden" id="gridH"></div>
    <div class="pinfo" id="pinfo">Toca num pássaro para o escolher.</div>
    <button id="buy" class="hidden"></button><button id="pickok">Voar!</button>
  </div>
  <div id="over" class="panel hidden">
    <h2>Fim de voo</h2>
    <div class="scores">
      <div>Pontos<b id="sc">0</b></div>
      <div>Recorde<b id="bs">0</b></div>
    </div>
    <div class="picks" id="mi"></div>
    <div class="picks" id="cn" style="color:#ffd25a"></div>
    <div id="top" class="top hidden"></div>
    <button id="again">Jogar outra vez</button>
    <button id="share" class="btn2">Partilhar</button>
    <button id="chg2" class="btn2">🐦 Pássaros</button>
  </div>
</div>

<script>
/* ====== CONFIG ====== */
const CONFIG = {
  // Link do teu bot/app para o botão "Partilhar" (ex.: https://t.me/o_teu_bot/jogo). Vazio = usa o URL da página.
  shareLink: '',
  // Asneiras dos pássaros (PT-PT). Mete false para uma versão sem palavrões.
  asneiras: true,
  // URL público do servidor do bot (Railway) para o top de jogadores. Vazio = sem top.
  apiUrl: 'https://rxbot-production-0047.up.railway.app'
};

/* ====== TELEGRAM ====== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#0b0716'); tg.setBackgroundColor('#0b0716');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}
const haptic = (kind, v) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind](v); } catch (e) {} };

/* ====== ARMAZENAMENTO (recorde e escolhas) ====== */
function lsGet(k) { try { return parseInt(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsGetS(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function cloudOK() { return tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'); }
function loadBest(cb) {
  const local = lsGet('corvo_best');
  if (cloudOK()) {
    try { tg.CloudStorage.getItem('corvo_best', (err, v) => cb(Math.max(local, parseInt(v) || 0))); return; } catch (e) {}
  }
  cb(local);
}
function saveBest(v) {
  lsSet('corvo_best', v);
  if (cloudOK()) { try { tg.CloudStorage.setItem('corvo_best', String(v)); } catch (e) {} }
}

/* ====== CARTEIRA (moedas + pássaros comprados; v = versão, ganha a mais recente) ====== */
const WAL = { c: 0, o: ['corvo'], v: 0 };
function walParse(s) { try { const o = JSON.parse(s); if (o && typeof o.c === 'number' && Array.isArray(o.o)) return o; } catch (e) {} return null; }
function walSave(cloud) {
  WAL.v++;
  const s = JSON.stringify(WAL);
  try { localStorage.setItem('corvo_w', s); } catch (e) {}
  if (cloud && cloudOK()) { try { tg.CloudStorage.setItem('corvo_w', s); } catch (e) {} }
}
function walLoad(cb) {
  const l = walParse(lsGetS('corvo_w'));
  if (l) Object.assign(WAL, l);
  if (cloudOK()) {
    try {
      tg.CloudStorage.getItem('corvo_w', (err, v) => {
        const c = walParse(v);
        if (c && c.v > WAL.v) { Object.assign(WAL, c); try { localStorage.setItem('corvo_w', JSON.stringify(WAL)); } catch (e) {} if (cb) cb(); }
      });
    } catch (e) {}
  }
  return !!l;
}
window.addEventListener('pagehide', () => walSave(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) walSave(true); });

/* ====== SOM ====== */
let actx, muted = lsGet('corvo_muted') === 1;
function beep(f, d, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(n + d);
  } catch (e) {}
}
// Grito de cada pássaro quando perde (sintetizado, não precisa de ficheiros de áudio)
const CRY = {
  corvo: [0, 1, 2].map(i => ({ at: [0, .33, .64][i], d: i === 2 ? .46 : .27, f0: 860 - i * 80, f1: (860 - i * 80) * .42, lf: 68 + i * 9, ld: 110, lt: 'square', b0: 1600, b1: 650, q: 2.2 })),
  ju: [
    { at: 0, d: .24, ty: 'square', f0: 560, f1: 400, b0: 1000, b1: 800, q: 3, v: .7, lf: 30, ld: 20 },
    { at: .32, d: .3, ty: 'square', f0: 520, f1: 330, b0: 1000, b1: 700, q: 3, v: .7, lf: 30, ld: 20 }],
  aguia: [
    { at: 0, d: .5, f0: 2300, f1: 1250, lf: 55, ld: 140, b0: 2600, b1: 1500, q: 3 },
    { at: .55, d: .45, f0: 2000, f1: 1100, lf: 60, ld: 140, b0: 2400, b1: 1300, q: 3 }],
  dragao: [
    { at: 0, d: 1.0, f0: 150, f1: 55, lf: 30, ld: 25, b0: 420, b1: 200, q: 1.2 },
    { at: 0, d: 1.0, ty: 'square', f0: 96, f1: 46, v: .5, b0: 300, b1: 150, q: 1 }],
  fenix: [
    { at: 0, d: .32, ty: 'triangle', f0: 700, f1: 2100, v: .7 },
    { at: .38, d: .36, ty: 'triangle', f0: 900, f1: 2500, v: .7 },
    { at: 0, d: .75, f0: 1700, f1: 1500, lf: 120, ld: 800, lt: 'square', v: .22, b0: 2000, b1: 1500, q: 1 }],
  pomba: [
    { at: 0, d: .3, ty: 'sine', f0: 430, f1: 340, lf: 7, ld: 14, v: .6 },
    { at: .36, d: .3, ty: 'sine', f0: 440, f1: 340, lf: 7, ld: 14, v: .6 },
    { at: .72, d: .42, ty: 'sine', f0: 420, f1: 300, lf: 7, ld: 14, v: .6 }],
  morcego: [0, .12, .24, .36, .48].map(at => ({ at, d: .08, ty: 'sine', f0: 5400 - at * 1200, f1: 3800, v: .55 })),
  conde: [
    { at: 0, d: .2, f0: 270, f1: 190, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .24, d: .2, f0: 250, f1: 175, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .48, d: .2, f0: 230, f1: 160, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .72, d: .2, f0: 210, f1: 145, lf: 6, ld: 10, b0: 800, b1: 500, q: 2 },
    { at: .96, d: .4, f0: 190, f1: 80, lf: 6, ld: 10, b0: 700, b1: 400, q: 2 }],
  liberdade: [
    { at: 0, d: .4, f0: 2600, f1: 1500, lf: 60, ld: 150, b0: 2800, b1: 1700, q: 3 },
    { at: .45, d: .35, f0: 2200, f1: 1300, lf: 55, ld: 130, b0: 2500, b1: 1500, q: 3 },
    { at: .85, d: .3, f0: 2400, f1: 1400, lf: 55, ld: 130, b0: 2500, b1: 1500, q: 3 }],
  pato: [
    { at: 0, d: .16, f0: 540, f1: 330, b0: 1400, b1: 900, q: 2.5, v: .9 },
    { at: .22, d: .16, f0: 520, f1: 320, b0: 1400, b1: 900, q: 2.5, v: .9 },
    { at: .44, d: .24, f0: 480, f1: 250, b0: 1300, b1: 800, q: 2.5, v: .9 }],
  mocho: [
    { at: 0, d: .35, ty: 'sine', f0: 420, f1: 360, lf: 5, ld: 10, v: .8 },
    { at: .5, d: .35, ty: 'sine', f0: 400, f1: 340, lf: 5, ld: 10, v: .8 },
    { at: 1.0, d: .55, ty: 'sine', f0: 390, f1: 290, lf: 5, ld: 10, v: .8 }],
  abutre: [
    { at: 0, d: .8, f0: 300, f1: 140, lf: 90, ld: 90, b0: 1800, b1: 700, q: 1.2, v: .6 },
    { at: .1, d: .7, ty: 'square', f0: 210, f1: 110, v: .3, b0: 900, b1: 500, q: 1 }],
  tucano: [
    { at: 0, d: .3, ty: 'square', f0: 700, f1: 450, lf: 40, ld: 80, b0: 1500, b1: 900, q: 2, v: .6 },
    { at: .4, d: .3, ty: 'square', f0: 650, f1: 420, lf: 40, ld: 80, b0: 1500, b1: 900, q: 2, v: .6 },
    { at: .8, d: .4, ty: 'square', f0: 620, f1: 380, lf: 40, ld: 80, b0: 1400, b1: 800, q: 2, v: .6 }],
  picapau: [0, .07, .14, .21, .28, .35, .5, .57, .64].map(at => ({ at, d: .05, ty: 'square', f0: 900, f1: 300, b0: 1200, b1: 600, q: 3, v: .8 })),
  dodo: [
    { at: 0, d: .5, f0: 180, f1: 120, lf: 14, ld: 20, b0: 700, b1: 400, q: 2 },
    { at: .6, d: .6, f0: 170, f1: 100, lf: 14, ld: 20, b0: 700, b1: 400, q: 2 }],
  arara: [
    { at: 0, d: .35, f0: 1500, f1: 900, lf: 50, ld: 200, b0: 2000, b1: 1200, q: 2.5 },
    { at: .4, d: .3, f0: 1300, f1: 800, lf: 50, ld: 200, b0: 2000, b1: 1200, q: 2.5 },
    { at: .8, d: .4, f0: 1600, f1: 900, lf: 50, ld: 200, b0: 2000, b1: 1200, q: 2.5 }],
  gaivota: [0, .22, .44, .66].map((at, i) => ({ at, d: .2, f0: 2000 - i * 150, f1: 1300, lf: 40, ld: 150, b0: 2600, b1: 1700, q: 2.5, v: .55 })),
  pelicano: [
    { at: 0, d: .5, f0: 230, f1: 110, lf: 9, ld: 18, b0: 700, b1: 350, q: 2, v: .9 },
    { at: .6, d: .55, f0: 210, f1: 90, lf: 9, ld: 18, b0: 650, b1: 320, q: 2, v: .9 }],
  pavao: [
    { at: 0, d: .5, f0: 700, f1: 1500, lf: 18, ld: 70, b0: 1200, b1: 2200, q: 3, v: .7 },
    { at: .65, d: .5, f0: 750, f1: 1600, lf: 18, ld: 70, b0: 1200, b1: 2200, q: 3, v: .7 }],
  ptero: [
    { at: 0, d: .9, f0: 380, f1: 1900, lf: 55, ld: 160, b0: 1500, b1: 3200, q: 1.5, v: .8 },
    { at: .05, d: .85, ty: 'square', f0: 260, f1: 1300, lf: 30, ld: 90, v: .25, b0: 900, b1: 2000, q: 1 },
    { at: .9, d: .7, f0: 160, f1: 70, lf: 12, ld: 25, b0: 500, b1: 200, q: 1.5, v: .7 }],
  ana: [
    { at: 0, d: .55, f0: 1500, f1: 2100, lf: 75, ld: 260, b0: 2600, b1: 3600, q: 3, v: .45 },
    { at: .12, d: .4, ty: 'square', f0: 1700, f1: 2300, lf: 90, ld: 240, v: .12, b0: 3000, b1: 3800, q: 2 }],
  jorge: [0, .09, .18, .27, .36].map(at => ({ at, d: .1, ty: 'sine', f0: 950, f1: 600, v: .3 })),
  rafa: [0, .07, .15, .24, .34].map(at => ({ at, d: .09, ty: 'square', f0: 3000, f1: 1200, b0: 4200, b1: 2000, q: .8, v: .3 })),
  paraiso: [
    ...[0, .12, .24, .36].map((at, i) => ({ at, d: .45, ty: 'sine', f0: 900 + i * 300, f1: 1200 + i * 300, lf: 8, ld: 20, v: .5 })),
    { at: .55, d: .35, ty: 'square', f0: 1100, f1: 700, lf: 30, ld: 120, b0: 1800, b1: 1100, q: 3, v: .3 }]
};
function cry(id) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, master = actx.createGain();
    master.gain.value = 1; master.connect(actx.destination);
    (CRY[id] || CRY.corvo).forEach(n => {
      const s = t0 + n.at, d = n.d;
      const o = actx.createOscillator(); o.type = n.ty || 'sawtooth';
      o.frequency.setValueAtTime(n.f0, s);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, n.f1), s + d);
      let node = o;
      if (n.lf) {
        const l = actx.createOscillator(); l.type = n.lt || 'sine'; l.frequency.value = n.lf;
        const lg = actx.createGain(); lg.gain.value = n.ld || 0;
        l.connect(lg); lg.connect(o.frequency); l.start(s); l.stop(s + d + .03);
      }
      if (n.b0) {
        const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = n.q || 2;
        f.frequency.setValueAtTime(n.b0, s); f.frequency.exponentialRampToValueAtTime(n.b1 || n.b0, s + d);
        node.connect(f); node = f;
      }
      const g = actx.createGain(), v = n.v == null ? 1 : n.v;
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(v, s + .02);
      g.gain.exponentialRampToValueAtTime(.0001, s + d);
      node.connect(g); g.connect(master); o.start(s); o.stop(s + d + .03);
    });
  } catch (e) {}
}

// Voz: síntese de voz do telemóvel, só se houver voz pt-PT instalada (evita sotaque brasileiro)
const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let ptVoice = null, voicesListed = false, ttsUnlocked = false;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices() || [];
  voicesListed = vs.length > 0;
  ptVoice = vs.find(v => /^pt[-_]PT/i.test(v.lang)) || null;
}
if (hasTTS) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function unlockTTS() {
  if (!hasTTS || ttsUnlocked) return; ttsUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
function stopSpeech() { if (hasTTS) { try { speechSynthesis.cancel(); } catch (e) {} } }
function tts(text, pitch, rate) {
  if (muted || !hasTTS) return;
  if (voicesListed && !ptVoice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-PT'; if (ptVoice) u.voice = ptVoice;

const TAU = Math.PI * 2;
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function poly(c, p) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); }
function fs(c) { c.fill(); c.stroke(); }
function dot(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }

// asa de membrana (dragão, morcego, capa do conde)
function membrane(c, wy, k, fill, stroke, fg) {
  const W1 = [-15 * k, wy * k - 13 * k], T1 = [-35 * k, wy * 1.35 * k - 5], T2 = [-31 * k, wy * k + 9], T3 = [-21 * k, wy * .65 * k + 12];
  c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-4, -4); c.lineTo(W1[0], W1[1]); c.lineTo(T1[0], T1[1]);
  c.quadraticCurveTo(-27 * k, wy * 1.1 * k + 1, T2[0], T2[1]);
  c.quadraticCurveTo(-24 * k, wy * .8 * k + 9, T3[0], T3[1]);
  c.quadraticCurveTo(-12 * k, wy * .4 * k + 10, -5, 5);
  c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = fg || stroke; c.lineWidth = 1;
  c.beginPath(); c.moveTo(W1[0], W1[1]); c.lineTo(T2[0], T2[1]); c.moveTo(W1[0], W1[1]); c.lineTo(T3[0], T3[1]); c.stroke();
}
// asa de ave com "dedos" (águia)
function featherWing(c, wy, k, fill, stroke) {
  c.fillStyle = fill; c.strokeStyle = stroke; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-4, -3);
  c.quadraticCurveTo(-14 * k, wy * k - 10, -33 * k, wy * 1.3 * k - 4);
  c.lineTo(-27 * k, wy * 1.2 * k + 3); c.lineTo(-32 * k, wy * k + 8);
  c.lineTo(-22 * k, wy * .8 * k + 8); c.lineTo(-25 * k, wy * .5 * k + 13);
  c.lineTo(-11 * k, 8); c.lineTo(2, 4); c.closePath(); c.fill(); c.stroke();
}
function flame(c, x, y, len, wd, col, ph, tt, dir) {
  const fk = Math.sin(tt * .5 + ph);
  c.fillStyle = col; c.beginPath(); c.moveTo(x, y - wd);
  c.quadraticCurveTo(x + dir * len * .5, y - wd * .6 + fk * 2, x + dir * len, y + fk * 4);
  c.quadraticCurveTo(x + dir * len * .5, y + wd * .6 + fk * 2, x, y + wd);
  c.closePath(); c.fill();
}
function flameUp(c, x, y, len, wd, col, ph, tt) {
  c.save(); c.translate(x, y); c.rotate(-Math.PI / 2 - .25); flame(c, 0, 0, len, wd, col, ph, tt, 1); c.restore();
}

function drawChar(c, id, x, y, o) {
  const ch = CHARS[id];
  c.save(); c.globalAlpha = o.a == null ? 1 : o.a;
  c.translate(x, y); c.rotate(o.rot || 0); c.scale(o.s, o.s);
  if (o.glow !== false) {
    const g = c.createRadialGradient(0, 0, 4, 0, 0, 38), q = ch.gl;
    g.addColorStop(0, 'rgba(' + q[0] + ',' + q[1] + ',' + q[2] + ',' + q[3] + ')');

    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 38, 0, TAU); c.fill();
  }
  c.lineCap = 'round'; c.lineJoin = 'round';
  ch.draw(c, o.w || 0, o.m || 0, o.tt || 0);

const owns = id => WAL.o.includes(id);

function rollH() {
  if (hSel !== 'rand') { sel.h = hSel; return; }

}

const SP = { p: { text: null, until: 0 }, h: { text: null, until: 0 } };
let cawUntil = 0, deathTimer = null, lastLine = '';
function pool(id, key) {
  return (CHARS[id][key] || []).filter(s => CONFIG.asneiras || s[0] !== '*').map(s => s[0] === '*' ? s.slice(1) : s);
}
function fmt(s, n) {
  return s.replace(/\{h\}/g, HI().name).replace(/\{p\}/g, PL().name).replace(/\{n\}/g, n == null ? '' : n);
}
function rnd(arr) {
  if (!arr.length) return '';
  let s = arr[(Math.random() * arr.length) | 0];
  if (arr.length > 1 && s === lastLine) s = arr[(Math.random() * arr.length) | 0];
  lastLine = s; return s;
}
function say(who, text, ms, voice) {
  const ch = who === 'p' ? PL() : HI();
  text = fmt(text);
  if (ch.bang) text = text.replace(/[.!?…\s]+$/, '') + '!!'; // a Ju acaba sempre com !!
  SP[who].text = text; SP[who].until = performance.now() + (ms || 2600);
  if (voice) tts(text, ch.pitch, ch.rate);
}
const isTalking = who => SP[who].text && performance.now() < SP[who].until;

/* ====== QUEM ATRAPALHA ====== */
const HD = { fx: 292, fy: 330, mouth: 0, n: 0, next: Infinity, nextBomb: Infinity, bombing: false, bombUntil: 0, replyAt: 0, spAt: Infinity, shove: 0, shoveAt: Infinity, shoveT: 0, shoveDir: 1 };
let gloatTimer = null;
const hdFront = () => HD.bombing || HD.shove === 2;
function updateHD(now, dt) {
  if (isTalking('h')) HD.mouth = 0.5 + 0.5 * Math.sin(now * 0.028); else HD.mouth *= 0.7;
  if (SP.h.text && now >= SP.h.until) SP.h.text = null;
  let tx, ty;
  if (state === 'playing') {
    const R = rv();
    if (rest) { HD.bombing = false; HD.shove = 0; HD.shoveAt = now + 5000; HD.nextBomb = now + 7000; HD.spAt = now + 8000; HD.next = Math.max(HD.next, now + 3000); }
    if (!HD.bombing && now > HD.nextBomb) { HD.bombing = true; HD.bombUntil = now + (R ? 1200 : 1600); }
    if (HD.bombing && now > HD.bombUntil) { HD.bombing = false; HD.nextBomb = now + (R ? 3000 + Math.random() * 2500 : 9000 + Math.random() * 7000) * (PT().calm || 1); }
    // rivais: empurrões de propósito (avisa com ⚠ e a seta da direção)
    if (R) {
      if (HD.shove === 0 && now > HD.shoveAt) { HD.shove = 1; HD.shoveT = now + 750; HD.shoveDir = Math.random() < 0.5 ? -1 : 1; haptic('notificationOccurred', 'warning'); }
      else if (HD.shove === 1 && now > HD.shoveT) { HD.shove = 2; HD.shoveT = now + 450; }
      else if (HD.shove === 2) {
        const d = Math.hypot(HD.fx - bird.x, HD.fy - bird.y);
        if (d < 26 || now > HD.shoveT) {
          if (d < 42) { bird.vy += HD.shoveDir * 3.4; shake = 6; beep(150, .15, 'sawtooth', .06, -60); haptic('impactOccurred', 'heavy'); }
          HD.shove = 0; HD.shoveAt = now + (4500 + Math.random() * 2500) * (PT().calm || 1);
        }
      }
    } else HD.shove = 0;
    let k;
    if (HD.shove === 1) { tx = bird.x - 70; ty = bird.y; k = 0.1; }
    else if (HD.shove === 2) { tx = bird.x + 4; ty = bird.y; k = 0.28; }
    else {
      if (HD.bombing) { tx = bird.x + 8; ty = bird.y - 4; }
      else { tx = bird.x - 52 + Math.sin(t * 0.02) * 16; ty = bird.y - 30 + Math.sin(t * 0.037) * 32; }
      k = HD.bombing ? 0.12 : 0.07;
    }
    ty = Math.max(50, Math.min(FLOOR - 70, ty));
    k = Math.min(1, k * dt);
    HD.fx += (tx - HD.fx) * k; HD.fy += (ty - HD.fy) * k;
    if (now > HD.spAt) { fireSpecial(now); HD.spAt = now + (R ? 6500 + Math.random() * 3000 : 10500 + Math.random() * 5000) * (PT().calm || 1); }
    if (now > HD.next && (R || !isTalking('p'))) {
      const line = R ? rnd(pool(sel.h, 'x')) : HD.n === 0 ? rnd(pool(sel.h, 'in')) : rnd(pool(sel.h, 't'));
      HD.n++; say('h', line, R ? 2000 : 2800, true);
      HD.next = now + (R ? 4200 + Math.random() * 1000 : 7000 + Math.random() * 4000);
      if (R) HD.replyAt = now + 2200;
      else if (HD.n > 1 && Math.random() < 0.5) HD.replyAt = now + 2900; // quem voa responde
    }
    if (HD.replyAt && now > HD.replyAt) {
      if (R || !isTalking('p')) say('p', rnd(pool(sel.p, R ? 'xr' : 'r')), R ? 2000 : 2200, true);
      HD.replyAt = 0;
    }
  } else {
    HD.bombing = false;
    tx = 292; ty = 300 + Math.sin(t * 0.05) * 14;
    const k = Math.min(1, 0.05 * dt);
    HD.fx += (tx - HD.fx) * k; HD.fy += (ty - HD.fy) * k;
  }
}

const bats = Array.from({ length: 3 }, (_, i) => ({ x: 80 + i * 150 + Math.random() * 60, y: 70 + Math.random() * 250, v: 0.5 + Math.random() * 0.5, ph: Math.random() * 6, s: 0.8 + Math.random() * 0.5 }));
let star = null, nextStar = 300;
function updateAmbient(dt) {
  for (const b of bats) {
    b.x -= b.v * dt * 1.4; b.y += Math.sin(t * 0.03 + b.ph) * 0.3 * dt;
    if (b.x < -40) { b.x = W + 30 + Math.random() * 160; b.y = 70 + Math.random() * 250; b.v = 0.5 + Math.random() * 0.5; }
  }
  if (!star && t > nextStar) star = { x: 140 + Math.random() * 220, y: 20 + Math.random() * 90, life: 0 };
  if (star) {
    star.life += dt; star.x -= 6 * dt; star.y += 3 * dt;
    if (star.life > 50) { star = null; nextStar = t + 450 + Math.random() * 450; }
  }
}
function drawAmbient() {
  if (star) {
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - star.life / 50);
    const g = ctx.createLinearGradient(star.x, star.y, star.x + 60, star.y - 30);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(star.x, star.y); ctx.lineTo(star.x + 60, star.y - 30); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#2f1d57';
  for (const b of bats) {
    const f = Math.sin(t * 0.35 + b.ph);
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.s, b.s);
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 3.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, -3); ctx.lineTo(-2, -9); ctx.lineTo(0, -3); ctx.moveTo(0, -3); ctx.lineTo(2, -9); ctx.lineTo(4, -3); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * 3, -1);
      ctx.quadraticCurveTo(s * 12, -10 * f - 5, s * 21, -3 * f + 3);
      ctx.quadraticCurveTo(s * 15, 1, s * 12, 5);
      ctx.quadraticCurveTo(s * 8, 1, s * 3, 4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

/* ====== LÓGICA ====== */
function update(dt) {
  t += dt;
  const nowMs = performance.now();
  if (isTalking('p') || nowMs < cawUntil) bird.mouth = 0.5 + 0.5 * Math.sin(nowMs * 0.03); else bird.mouth *= 0.7;
  if (SP.p.text && nowMs >= SP.p.until) SP.p.text = null;
  updateAmbient(dt);
  updateHD(nowMs, dt);
  bird.wing += dt * (state === 'playing' ? 0.38 : 0.16);
  const speed = (2.3 + Math.min(score * 0.04, 1.2) + Math.min(stageN * 0.06, 0.3)) * (on('turbo') ? 1.3 : 1) * (PT().spd || 1) * (STG.vert ? 1.08 : 1);
  updateMode(nowMs, dt);
  updateSpecials(nowMs, dt);

  if (state === 'ready' || state === 'pick') {
    scroll += 1.2 * dt;
    bird.y = 330 + Math.sin(t * 0.07) * 8; bird.rot = 0;
  } else if (state === 'playing') {
    if (rest) updateRest(nowMs, dt);
    if (rest && rest.ph !== 'out') {
      scroll += 1.2 * dt; bird.vy = 0; bird.rot = 0;
      bird.y += (rest.cy + Math.sin(t * 0.07) * 8 - bird.y) * Math.min(1, 0.08 * dt);
    } else {
    scroll += speed * dt;
    bird.vy = Math.min(bird.vy + (PT().grav || 0.42) * dt, 9);
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.075));
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

    if (!rest && (!pipes.length || pipes[pipes.length - 1].x <= LW - ((on('turbo') ? 208 : 160) - Math.min(stageN * 8, 24)))) {
      const np = makePipe(), pr = pipes[pipes.length - 1];
      pipes.push(np); if (pr) spawnCoins(pr, np);
    }
    const mg = PT().magnet || 0;
    for (const c of coins) {
      c.x -= speed * dt;
      if (mg) { const dx = bird.x - c.x, dy = bird.y - c.y, d = Math.hypot(dx, dy); if (d < mg && d > 1) { const k = (Math.min(1, (mg - d) / mg) * 4 + 1.5) * dt; c.x += dx / d * k; c.y += dy / d * k; } }
    }
    for (const p of pipes) {
      p.x -= speed * dt;
      if (p.amp) p.gapY = p.g0 + Math.sin(t * 0.035 + p.ph) * p.amp;
      if (!p.passed && p.x + PW < bird.x - bird.r) {
        p.passed = true; score++;
        if (PT().pipeCoin) { runCoins += 1; WAL.c += 1; pops.push({ x: bird.x + 22, y: bird.y - 26, txt: '+1', life: 1, c: '#ffe28a' }); walSave(false); }
        if (PT().dance && score % PT().dance === 0) startDance(nowMs);
        if (score % 50 === 0 && !rest) beginRest(nowMs);
        if ([5, 10, 15, 20, 30, 50].includes(score)) say('p', rnd(pool(sel.p, 'p')).replace(/\{n\}/g, score), 2200, true);
        beep(880, .12, 'triangle', .05, 300); haptic('impactOccurred', 'soft');
      }
    }
    pipes = pipes.filter(p => p.x > -PW - 10);

    const r = bird.r - 2;
    if (bird.y + r >= FLOOR) { bird.y = FLOOR - r; die('ground'); }
    for (const p of pipes) {
      if (p.broken || nowMs < danceUntil) continue;
      const pi = PW * (1 - (PT().pw || 1)) / 2;
      if (bird.x + r > p.x + pi && bird.x - r < p.x + PW - pi &&
          (bird.y - r < p.gapY - p.gap / 2 || bird.y + r > p.gapY + p.gap / 2)) {
        if (smashLeft > 0 && performance.now() >= invulnUntil) { smashLeft--; smashPipe(p); continue; }
        die('pipe'); break;
      }
    }
    if (state === 'playing') {
      coins = coins.filter(c => {
        if (Math.hypot(c.x - bird.x, c.y - bird.y) < bird.r + (c.v > 1 ? 13 : 11)) { takeCoin(c); return false; }
        return c.x > -20;
      });
    }
    }
  } else if (state === 'over') {
    bird.vy = Math.min(bird.vy + 0.5 * dt, 12);
    bird.y += bird.vy * dt;
    bird.rot = Math.min(bird.rot + 0.08 * dt, 1.5);
    const floor = FLOOR - bird.r;
    if (bird.y > floor) { bird.y = floor; bird.vy = 0; }
  }

  for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 0.18 * dt; f.vx *= 0.985; f.life -= 0.012 * dt; f.rot += 0.1 * dt; }
  feathers = feathers.filter(f => f.life > 0);
  if (state === 'playing' && nowMs < danceUntil) FX.parts.push({ k: 'spark', w: 1, x: bird.x - 10, y: bird.y + (Math.random() - .5) * 14, vx: -1 - Math.random() * 2, vy: (Math.random() - .5) * 2, life: 1, r: 2.4, c: RAINBOW[(Math.random() * 6) | 0] });
  for (const d of debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 0.5 * dt; d.rot += d.vr * dt; d.life -= 0.012 * dt; }
  debris = debris.filter(d => d.life > 0 && d.y < LH + 80);
  for (const p of pops) { p.y -= 0.9 * dt; p.life -= 0.03 * dt; }
  pops = pops.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 0.6 * dt);
}

      });
    },
    ground() { groundFill('#161c2c', '#4a5a7a'); layer(1, 60, (x, k) => { ctx.fillStyle = (Math.floor(t / 20) + k) % 3 ? '#2a3550' : '#7fe3ff'; ctx.fillRect(x + 10, FLOOR + 14, 8, 5); }); }
  },
  neve: {
    sky() {
      skyGrad('#0b1633', '#335b8f', '#b5d3ec'); starLayer(.02, 80, .5);
      layer(.1, 250, (x, k) => {
        const h = 150 + hs(k, 2) * 90, cx = x + 125;
        ctx.fillStyle = '#5f7fa8'; ctx.beginPath(); ctx.moveTo(x, FLOOR); ctx.lineTo(cx, FLOOR - h); ctx.lineTo(x + 250, FLOOR); ctx.fill();
        ctx.fillStyle = '#f2f7ff'; ctx.beginPath(); ctx.moveTo(cx - h * .22, FLOOR - h * .78); ctx.lineTo(cx, FLOOR - h); ctx.lineTo(cx + h * .22, FLOOR - h * .78); ctx.lineTo(cx + h * .1, FLOOR - h * .7); ctx.lineTo(cx, FLOOR - h * .78); ctx.lineTo(cx - h * .1, FLOOR - h * .7); ctx.fill();
      });
      layer(.28, 90, (x, k) => pine(x + hs(k, 3) * 30, FLOOR, 90 + hs(k, 4) * 40, 50, '#1d3a52', true));
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 60; i++) { const x = drift(i, .9, LW + 80) + Math.sin(t * .03 + i) * 10, y = (t * (.8 + hs(i, 2) * 1.2) + hs(i, 3) * LH) % LH, s = 2 + (i % 3); ctx.fillRect(x, y, s, s); }
    },
    ground() { groundFill('#e6f0fa', '#ffffff', { c: '#b6cce2', step: 52, w: 30, h: 3 }); }
  },
  mar: {
    sky() {
      skyGrad('#021a3d', '#0a5391', '#27b3d6');
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      for (let i = 0; i < 5; i++) { const x0 = i * (LW / 4) - 40 + Math.sin(t * .012 + i) * 24; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 46, 0); ctx.lineTo(x0 - 60, FLOOR); ctx.lineTo(x0 - 120, FLOOR); ctx.closePath(); ctx.fill(); }
      ctx.strokeStyle = '#0f6b52'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      layer(.15, 95, (x, k) => { const h = 80 + hs(k, 2) * 80; ctx.beginPath(); ctx.moveTo(x, FLOOR); for (let j = 1; j <= 6; j++) ctx.lineTo(x + Math.sin(t * .04 + j * .8 + k) * 10, FLOOR - h * j / 6); ctx.stroke(); });
      ctx.lineCap = 'butt';
      layer(.35, 140, (x, k) => { ctx.fillStyle = k % 2 ? '#d6527a' : '#e8873a'; for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(x + j * 14, FLOOR - 10 - (j % 2) * 14, 12 + hs(k, j) * 8, 0, 7); ctx.fill(); } });
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
      for (let i = 0; i < 26; i++) { const x = drift(i, .4, LW) + Math.sin(t * .04 + i) * 6, y = FLOOR - ((t * (.5 + hs(i, 2)) + hs(i, 3) * FLOOR) % FLOOR); ctx.beginPath(); ctx.arc(x, y, 2 + hs(i, 4) * 3, 0, 7); ctx.stroke(); }
    },
    ground() { groundFill('#c9b27a', '#e0cc92', { c: '#a58e58', step: 40, w: 10, h: 5 }); }
  },
  cidade: {
    sky() {
      skyGrad('#0d0024', '#3b0a5c', '#ff4fa8');
      const cx = LW * .65, cy = FLOOR - 120, g = ctx.createLinearGradient(0, cy - 56, 0, cy + 56); g.addColorStop(0, '#ffdf6b'); g.addColorStop(1, '#ff4fa8');
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 56, 0, 7); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(cx - 60, cy - 60, 120, 120);
      ctx.fillStyle = '#3b0a5c'; [[10, 3], [24, 4], [36, 5], [46, 6]].forEach(b => ctx.fillRect(cx - 60, cy + b[0], 120, b[1])); ctx.restore();
      layer(.12, 60, (x, k) => { ctx.fillStyle = '#1a0b3a'; ctx.fillRect(x, FLOOR - (90 + hs(k, 3) * 130), 44 + hs(k, 2) * 20, 90 + hs(k, 3) * 130); });
      layer(.3, 85, (x, k) => {
        const w = 56 + hs(k, 4) * 26, h = 70 + hs(k, 5) * 140; ctx.fillStyle = '#0f0624'; ctx.fillRect(x, FLOOR - h, w, h);
        const rows = Math.floor((h - 26) / 18), cols = Math.floor((w - 16) / 14);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const q = hs(k * 31 + r, c); if (q > .55) { ctx.fillStyle = q > .8 ? '#5fe3ff' : '#ffe27a'; ctx.fillRect(x + 8 + c * 14, FLOOR - h + 12 + r * 18, 6, 8); } }
      });
    },
    ground() { groundFill('#120a1e', '#ff4fa8'); layer(1, 70, x => { ctx.fillStyle = '#5fe3ff'; ctx.fillRect(x, FLOOR + GRD * .55, 30, 3); }); }
  }
};
function drawRestUI() {
  if (!rest) return;
  if (rest.ph === 'in' || rest.ph === 'hold') {
    const s = STAGES[stageN % 8], al = rest.ph === 'in' ? 1 - rest.a : 1;
    ctx.save(); ctx.globalAlpha = al; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(14,9,30,.8)'; ctx.strokeStyle = 'rgba(217,164,65,.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(36, 200, W - 72, 150, 16); else ctx.rect(36, 200, W - 72, 150); ctx.fill(); ctx.stroke();
    ctx.lineJoin = 'round'; ctx.font = 'bold 32px Georgia, serif'; ctx.fillStyle = '#d9a441'; ctx.fillText('Etapa ' + (stageN + 1), W / 2, 248);
    ctx.font = 'bold 22px Georgia, serif'; ctx.fillStyle = '#fff'; ctx.fillText(s.e + ' ' + s.n + '   ' + DIRS[STG.dir], W / 2, 288);
    if (rest.ph === 'hold') { ctx.font = '16px Georgia, serif'; ctx.globalAlpha = al * (0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 350))); ctx.fillStyle = '#ffcf6b'; ctx.fillText('Descansa um pouco… toca para continuar', W / 2, 328); }
    ctx.restore();
  }
  if (rest.a > 0) { ctx.fillStyle = 'rgba(0,0,0,' + rest.a + ')'; ctx.fillRect(0, 0, W, H); }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  const th = (state === 'pick' || stageN > 0) ? null : theme();
  const sc = (state !== 'pick' && stageN > 0 && STG.theme !== 'torre') ? SCENES[STG.theme] : null;
  ctx.save();
  if (state !== 'pick') worldXform();
  if (th) drawStadium(th);
  else if (sc) sc.sky();
  else {
    drawSky();
    drawAmbient();
    drawTowers('#1c1236', 0.12, 0.8, 3);
    drawTowers('#130b27', 0.25, 1.0, 0);
    drawMist();
  }
  if (state !== 'pick') {
    if (!hdFront()) drawHinderer(false);
    for (const p of pipes) if (!p.broken) drawPipe(p);
    drawDebris();
    drawCoins();
    if (th) drawGroundStadium(); else if (sc) sc.ground(); else drawGround();
    drawFeathers();
    drawPlayer();
    if (hdFront()) drawHinderer(true); // fotobomb / empurrão à frente
    drawWarning();
    drawWorldFx();
    drawOverlayFx();
    drawSonar();
  } else {
    drawGround();
  }
  ctx.restore();
  if (state !== 'pick') {
    drawSpecials();
    drawSubtitles();
    drawScore();
    drawBanner();
    drawRestUI();
  }
  ctx.restore();
  if (state === 'pick') drawThumbs();
}

/* ====== LOOP ====== */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 16.667, 2.5); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (hadChoice) showReady(); else openPick();

</script>
</body>
</html>
